<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人脈ノート</title>
<meta name="theme-color" content="#23507D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="人脈ノート">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --ink:#1B2740; --muted:#566271; --line:#D3DBE1;
  --accent:#23507D; --accent-ink:#FFFFFF; --accent-soft:#DCE7F2;
  --ok:#2C7650; --ok-soft:#DDF0E5; --warn:#9A6200; --warn-soft:#FBEBCB; --bad:#B42318; --bad-soft:#FBE1DE;
  --chip:#E4EBF1;
  --sans:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --serif:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121821; --surface:#1A222D; --ink:#E6ECF2; --muted:#9AA7B4; --line:#2B3644;
    --accent:#8DB8E6; --accent-ink:#0D1622; --accent-soft:#22344A;
    --ok:#6CC895; --ok-soft:#173327; --warn:#E6B45A; --warn-soft:#3A2E14; --bad:#F2877C; --bad-soft:#3D1C1A;
    --chip:#243040; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121821; --surface:#1A222D; --ink:#E6ECF2; --muted:#9AA7B4; --line:#2B3644;
  --accent:#8DB8E6; --accent-ink:#0D1622; --accent-soft:#22344A;
  --ok:#6CC895; --ok-soft:#173327; --warn:#E6B45A; --warn-soft:#3A2E14; --bad:#F2877C; --bad-soft:#3D1C1A;
  --chip:#243040; color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.7; -webkit-text-size-adjust:100%; }
button,input,select,textarea{ font:inherit; color:inherit; }
img{ max-width:100%; }
:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }

header.top{ display:flex; align-items:center; justify-content:space-between; gap:12px; max-width:820px; margin:0 auto; padding:14px 16px 6px; }
header.top h1{ font-family:var(--serif); font-weight:700; font-size:1.35rem; letter-spacing:.08em; margin:0; }
header.top h1 small{ font-family:var(--sans); font-weight:400; font-size:.8125rem; color:var(--muted); letter-spacing:0; margin-left:.6em; }
@media (max-width:520px){ header.top h1 small{ display:none; } }
.node .nm{ text-align:left; }
details>summary::-webkit-details-marker{ display:none; }
details>summary .nm::before{ content:"▸ "; color:var(--muted); }
details[open]>summary .nm::before{ content:"▾ "; }
.seg.full{ display:flex; flex-wrap:wrap; gap:6px; border:0; background:none; }
.seg.full button{ border:1px solid var(--line); border-radius:8px; background:var(--surface); }
.iconbtn{ border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:6px 12px; cursor:pointer; font-size:.9rem; }

nav.tabs{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); }
nav.tabs .in{ display:grid; grid-template-columns:repeat(5,1fr); max-width:820px; margin:0 auto; }
nav.tabs button{ border:0; background:none; padding:10px 2px 9px; font-size:.8125rem; color:var(--muted); cursor:pointer; line-height:1.3; }
nav.tabs button b{ display:flex; justify-content:center; height:24px; color:inherit; }
nav.tabs button[aria-current="page"]{ color:var(--accent); box-shadow:inset 0 3px 0 var(--accent); }
@media (min-width:900px){
  nav.tabs{ position:static; border:0; background:none; padding:0; }
  nav.tabs .in{ grid-template-columns:repeat(5,auto); justify-content:start; gap:4px; padding:0 16px; border-bottom:1px solid var(--line); }
  nav.tabs button{ padding:10px 16px; font-size:.95rem; }
  nav.tabs button b{ display:none; }
  nav.tabs button[aria-current="page"]{ box-shadow:inset 0 -3px 0 var(--accent); color:var(--ink); font-weight:700; }
}
main{ max-width:820px; margin:0 auto; padding:8px 16px 110px; }
@media (min-width:900px){ main{ padding-bottom:48px; } }

h2{ font-family:var(--serif); font-size:1.15rem; margin:22px 0 10px; }
h3{ font-size:1rem; margin:18px 0 8px; }
.muted{ color:var(--muted); }
.small{ font-size:.875rem; }
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; }
.stack>*+*{ margin-top:12px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media (max-width:520px){ .grid2{ grid-template-columns:1fr; } }

label.f{ display:block; font-size:.875rem; color:var(--muted); }
label.f>span{ display:block; margin-bottom:4px; }
input[type=text],input[type=search],input[type=number],input[type=date],input[type=tel],input[type=email],select,textarea{
  width:100%; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:10px 12px; font-size:16px; color:var(--ink);
}
textarea{ min-height:84px; resize:vertical; line-height:1.6; }
textarea.memo{ min-height:150px; font-size:17px; }
.btn{ border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:10px 16px; cursor:pointer; font-weight:700; }
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn.ghost{ background:none; }
.btn.danger{ color:var(--bad); border-color:var(--bad); background:none; }
.btn:disabled{ opacity:.55; cursor:default; }
.btn.small{ padding:6px 12px; font-weight:400; font-size:.9rem; }
.linkish{ border:0; background:none; color:var(--accent); cursor:pointer; padding:0; text-decoration:underline; text-underline-offset:3px; }

.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ display:inline-flex; align-items:center; gap:6px; background:var(--chip); border-radius:999px; padding:4px 6px 4px 12px; font-size:.92rem; }
.chip.new{ background:var(--accent-soft); }
.chip button{ border:0; background:none; cursor:pointer; color:var(--muted); font-size:1rem; line-height:1; padding:2px 6px; }
.suggest{ border:1px solid var(--line); border-radius:10px; background:var(--surface); margin-top:4px; overflow:hidden; }
.suggest button{ display:block; width:100%; text-align:left; border:0; border-top:1px solid var(--line); background:none; padding:9px 12px; cursor:pointer; }
.suggest button:first-child{ border-top:0; }

.badge{ display:inline-block; font-size:.8125rem; padding:1px 8px; line-height:1.6; border-radius:6px; background:var(--chip); color:var(--ink); white-space:nowrap; }
.badge.bad{ background:var(--bad-soft); color:var(--bad); }
.badge.warn{ background:var(--warn-soft); color:var(--warn); }
.badge.ok{ background:var(--ok-soft); color:var(--ok); }
.badge.acc{ background:var(--accent-soft); color:var(--accent); }

.list{ list-style:none; margin:0; padding:0; }
.list>li{ border-top:1px solid var(--line); }
.list>li:first-child{ border-top:0; }
.list>li>button{ display:block; width:100%; text-align:left; border:0; background:none; padding:12px 4px; cursor:pointer; }
.list .t{ font-weight:700; }
.list .s{ font-size:.875rem; color:var(--muted); }

/* ホームの要点 */
.alerts{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
@media (max-width:620px){ .alerts{ grid-template-columns:repeat(2,1fr); } }
.ro .w-only{ display:none !important; }
body:not(.ro) .ro-only{ display:none !important; }
.qcard{ border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:10px 12px; }
.qcard + .qcard{ margin-top:8px; }
.qhead{ display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin:18px 0 8px; }
.qhead h3{ margin:0; }
.qctl{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:8px; }
.qctl input[type=number]{ width:110px; }
.qctl select{ width:auto; max-width:100%; }
.alerts button{ border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:10px; text-align:left; cursor:pointer; }
.alerts .n{ font-family:var(--serif); font-size:1.6rem; font-weight:700; line-height:1.1; display:block; }
.alerts .l{ font-size:.875rem; line-height:1.45; display:block; color:var(--muted); }
.alerts .is-bad .n{ color:var(--bad); }
.alerts .is-warn .n{ color:var(--warn); }

.steps{ counter-reset:s; }
.stepbox{ border-left:3px solid var(--accent); padding-left:14px; }

/* 名刺のような人物表示 */
.meishi{ background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:18px 18px 14px; position:relative; }
.meishi .org{ font-size:.875rem; color:var(--muted); }
.meishi .nm{ font-family:var(--serif); font-size:1.9rem; font-weight:700; letter-spacing:.12em; margin:6px 0 0; line-height:1.3; }
.meishi .kn{ font-size:.8125rem; color:var(--muted); letter-spacing:.1em; }
.meishi .star{ position:absolute; top:12px; right:12px; }
.meishi .head{ display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center; }
.meishi .head .org{ padding-right:84px; }
.meishi .head .nm{ font-size:1.7rem; letter-spacing:.06em; word-break:keep-all; }
.av{ display:inline-flex; align-items:center; justify-content:center; border-radius:50%; object-fit:cover; background:var(--chip); color:var(--muted); font-family:var(--serif); font-weight:700; flex:none; overflow:hidden; }
.av-lg{ width:84px; height:84px; font-size:2rem; }
.av-sm{ width:40px; height:40px; font-size:1.05rem; }
.av-actions{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.plist-row{ display:flex; gap:12px; align-items:center; }
.cropbox{ position:relative; display:inline-block; max-width:100%; touch-action:none; user-select:none; background:#000; border-radius:8px; overflow:hidden; }
.cropbox img{ display:block; max-width:100%; max-height:60vh; }
#cr-sel{ position:absolute; border:2px solid #fff; border-radius:50%; box-shadow:0 0 0 9999px rgba(0,0,0,.45); pointer-events:none; }
.cr-prev{ width:84px; height:84px; border-radius:50%; background:var(--chip); }
.face-prev{ width:56px; height:56px; border-radius:50%; object-fit:cover; }
.ledger{ display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-top:12px; }
.ledger div{ padding:8px 10px; border-left:1px solid var(--line); }
.ledger div:first-child{ border-left:0; }
.ledger b{ display:block; font-family:var(--serif); font-size:1.15rem; }
.ledger span{ font-size:.8125rem; color:var(--muted); }
.timeline{ list-style:none; margin:0; padding:0 0 0 14px; border-left:2px solid var(--line); }
.timeline li{ position:relative; padding:0 0 14px 6px; }
.timeline li::before{ content:""; position:absolute; left:-21px; top:8px; width:10px; height:10px; border-radius:50%; background:var(--surface); border:2px solid var(--accent); }

/* 回り具合 */
.tree{ list-style:none; margin:0; padding:0; }
.tree .tree{ padding-left:14px; border-left:1px dashed var(--line); margin-left:6px; }
.node{ display:grid; grid-template-columns:1fr auto; gap:4px 10px; padding:9px 0; border-top:1px solid var(--line); align-items:center; }
.node .nm{ font-weight:700; }
.node .meta{ font-size:.875rem; color:var(--muted); grid-column:1/-1; display:flex; gap:12px; flex-wrap:wrap; }
.bar{ grid-column:1/-1; height:6px; border-radius:3px; background:var(--chip); overflow:hidden; }
.bar i{ display:block; height:100%; }
.rec-fresh{ background:var(--ok); } .rec-mid{ background:var(--warn); } .rec-old{ background:var(--bad); }
:root{ --pri-high:#D9480F; --pri-mid:#E0A100; --pri-low:#7088A8; --pb-high-bg:#FFE6D5; --pb-high-fg:#9A3412; --pb-mid-bg:#FFF2C2; --pb-mid-fg:#6F5200; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --pri-high:#FF8A3D; --pri-mid:#F2C14E; --pri-low:#8DA2C0; --pb-high-bg:#3D2414; --pb-high-fg:#FFB27A; --pb-mid-bg:#3A3112; --pb-mid-fg:#F2C14E; } }
:root[data-theme="dark"]{ --pri-high:#FF8A3D; --pri-mid:#F2C14E; --pri-low:#8DA2C0; --pb-high-bg:#3D2414; --pb-high-fg:#FFB27A; --pb-mid-bg:#3A3112; --pb-mid-fg:#F2C14E; }
.pc-high{ background:var(--pri-high); } .pc-mid{ background:var(--pri-mid); } .pc-low{ background:var(--pri-low); } .pc-none{ background:var(--accent); }
.badge.pb-high{ background:var(--pb-high-bg); color:var(--pb-high-fg); font-weight:700; }
.badge.pb-mid{ background:var(--pb-mid-bg); color:var(--pb-mid-fg); }
.badge.pb-low{ background:var(--chip); color:var(--muted); }
.node.is-high{ box-shadow:inset 3px 0 0 var(--pri-high); padding-left:10px; }
.nm-line{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0; }
.nm-line .nm{ font-weight:700; }
.nm-tog{ border:0; background:none; padding:4px 0; cursor:pointer; font-weight:700; font-size:1rem; color:var(--ink); display:inline-flex; align-items:center; gap:6px; text-align:left; }
.nm-tog .tri{ display:inline-block; width:1em; color:var(--muted); }
.nm-tog .cnt{ font-weight:400; font-size:.8125rem; color:var(--muted); background:var(--chip); border-radius:999px; padding:0 7px; }
.node-act{ display:flex; gap:4px; justify-content:flex-end; }
.node .meta .hi{ color:var(--pb-high-fg); font-weight:700; }
.node .meta .unk{ color:var(--warn); }
.bar{ height:8px; }
.flash > .node{ background:var(--accent-soft); transition:background .3s; }
ol.cand{ list-style:none; }

.seg{ display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface); flex-wrap:wrap; }
.seg button{ border:0; border-left:1px solid var(--line); background:none; padding:7px 12px; cursor:pointer; font-size:.9rem; }
.seg button:first-child{ border-left:0; }
.seg button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); }

.item{ padding:12px 4px; }
.item .top{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.item .txt{ margin:4px 0 2px; }

/* シート */
.sheet-wrap{ position:fixed; inset:0; z-index:50; background:rgba(10,16,24,.45); display:flex; align-items:flex-end; justify-content:center; }
.sheet{ background:var(--bg); width:100%; max-width:720px; max-height:92%; overflow:auto; border-radius:18px 18px 0 0; padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px)); }
@media (min-width:760px){ .sheet-wrap{ align-items:center; } .sheet{ border-radius:18px; max-height:88%; } }
.sheet-head{ display:flex; justify-content:space-between; align-items:center; gap:8px; position:sticky; top:-16px; background:var(--bg); padding:4px 0 8px; z-index:1; }
.sheet-head h2{ margin:0; }

.toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom,0px)); z-index:60; background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:.92rem; max-width:90%; }
.notice{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--surface); }
.notice.warn{ border-color:var(--warn); background:var(--warn-soft); }
.busy{ display:inline-flex; align-items:center; gap:8px; color:var(--muted); font-size:.9rem; }
.busy::before{ content:""; width:14px; height:14px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--accent); animation:spin 1s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce){ .busy::before{ animation:none; } }
.hide{ display:none !important; }
/* 数を押すと中身が出る */
.cnt-btn{ border:0; background:none; padding:0; font:inherit; color:inherit; cursor:pointer; text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px; position:relative; text-align:left; }
.cnt-btn::after{ content:""; position:absolute; inset:-8px -4px; }
.node .meta .cnt-btn.unk{ color:var(--warn); font-weight:700; }
.sumbtn{ display:inline-flex; align-items:center; gap:8px; min-height:44px; border:1px solid var(--warn); background:var(--warn-soft); color:var(--warn); border-radius:10px; padding:8px 14px; font-weight:700; cursor:pointer; }
.sumbtn::after{ content:"›"; font-size:1.3em; line-height:1; }
.qsum{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.hcrow{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }
.hcrow input[type=number]{ width:96px; min-height:44px; }
.hcrow .btn{ min-height:44px; }
.qsub{ display:flex; gap:0 18px; flex-wrap:wrap; margin-top:2px; }
.qsub .linkish{ padding:11px 0; font-size:.9rem; }
.toast{ display:flex; align-items:center; gap:4px; }
.toast button{ border:0; background:none; color:inherit; font:inherit; font-weight:700; text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:10px 6px; margin:-10px -6px -10px 8px; white-space:nowrap; }
.sheet-head .lead{ display:flex; align-items:center; gap:8px; min-width:0; }
/* 選ぶだけで入れられる小さなボタン */
.qchips{ display:flex; flex-wrap:wrap; gap:6px; }
.qchip{ border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:5px 12px; cursor:pointer; font-size:.9375rem; line-height:1.5; }
.qchip[aria-pressed="true"],.qchip[aria-checked="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.qchip .sub{ color:var(--muted); font-size:.8125rem; margin-left:4px; }
.qchip[aria-pressed="true"] .sub,.qchip[aria-checked="true"] .sub{ color:inherit; }
.qlabel{ font-size:.875rem; color:var(--muted); margin:8px 0 4px; }
/* 記録する: 下に固定する保存のまとまり */
.savebar{ position:sticky; bottom:calc(70px + env(safe-area-inset-bottom,0px)); z-index:5; display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; box-shadow:0 -4px 16px rgba(16,24,40,.10); }
.savebar .btn{ min-height:48px; padding-left:22px; padding-right:22px; }
@media (min-width:900px){ .savebar{ bottom:12px; } }
@media (pointer:coarse){ #capture:has(textarea:focus, input[type=text]:focus, input[type=search]:focus, input[type=number]:focus) .savebar{ visibility:hidden; } }
/* 記録一覧の絞り込み */
.fil-row{ display:flex; gap:8px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
.fil-on{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px; }
/* 指で押しやすく(Apple HIG 44pt、WCAG 2.5.8) */
.chip button{ position:relative; }
.chip button::after{ content:""; position:absolute; inset:-10px -6px; }
@media (pointer:coarse){
  .btn.small,.iconbtn,.seg button,.nm-tog,.qchip{ min-height:44px; }
  .list>li>button{ min-height:44px; }
}
.vlist .vrow{ display:grid; grid-template-columns:1fr; gap:6px; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--surface); }
.vlist .vrow + .vrow{ margin-top:8px; }
.vrow .r2{ display:grid; grid-template-columns:1fr 150px auto; gap:6px; }
@media (max-width:520px){ .vrow .r2{ grid-template-columns:1fr 1fr auto; } }
/* 心得(ご本人だけ) */
.top-actions{ display:flex; gap:8px; flex:none; }
header.top .iconbtn[aria-current="page"]{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.kokoro-line{ display:grid; grid-template-columns:1fr auto; align-items:center; column-gap:10px; row-gap:2px; width:100%; text-align:left; border:1px solid var(--line); border-left:4px solid var(--accent); background:var(--surface); color:var(--ink); border-radius:12px; padding:10px 14px; min-height:48px; cursor:pointer; margin-top:10px; font:inherit; }
.kokoro-line .lbl{ grid-column:1; font-size:.8125rem; color:var(--muted); }
.kokoro-line .tx{ grid-column:1; font-family:var(--serif); font-weight:700; line-height:1.5; }
.kokoro-line::after{ content:"›"; grid-column:2; grid-row:1 / span 2; color:var(--muted); font-size:1.3em; }
.princ{ display:block; width:100%; text-align:left; font:inherit; color:var(--ink); border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:12px 14px; cursor:pointer; min-height:48px; }
.princ + .princ{ margin-top:8px; }

<div id="toast-root"></div>

<script src="config.js"></script>
<script src="msal-browser.min.js"></script>
<script>
"use strict";
/* ============================================================
   人脈ノート 専用版の土台
   - 保存先: お試し=この端末の中(IndexedDB) / 本番=組合のMicrosoft 365(OneDrive)
   - サインイン: 組合のOutlookのアカウント(MSAL)
   - 予定: Outlookの予定表(Microsoft Graph)
   画面の本体は、window.claude という窓口だけを通してここを使う
   ============================================================ */
(function(){
const CFG=Object.assign({clientId:"",tenantId:"",folder:"人脈ノート",privateFolder:"人脈ノート_本人だけ"},window.JN_CONFIG||{});
/* 求める権限は最小に: 自分のノートは「自分のファイル」だけ。共有されたノートを開くときだけ「共有されたファイル」も */
const scopes=()=>lsg("jn-join")?["User.Read","Files.ReadWrite.All"]:["User.Read","Files.ReadWrite"];
const G="https://graph.microsoft.com/v1.0";
const TZ="Tokyo Standard Time";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const enc=encodeURIComponent;
const lsg=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lss=(k,v)=>{try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}};
const BASE_URL=location.origin+location.pathname.replace(/[^/]*$/,"");
const A={cfg:CFG,configured:!!(CFG.clientId&&CFG.tenantId),mode:null,me:{id:"",name:"",mail:""},owner:true,ownerName:"",spaces:{},backend:null,pca:null,account:null,baseUrl:BASE_URL,lsg,lss};
window.JNAPP=A;

/* ---------- この端末の中の置き場(IndexedDB) ---------- */
let idbP=null;
function idb(){return idbP||(idbP=new Promise((res,rej)=>{const r=indexedDB.open("jinmyaku-note",1);r.onupgradeneeded=()=>r.result.createObjectStore("files");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));}
async function idbOp(mode,fn){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction("files",mode);const st=tx.objectStore("files");let out;const rq=fn(st);if(rq)rq.onsuccess=()=>{out=rq.result;};tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});}
const Local={kind:"trial",
  async read(space,name){const v=await idbOp("readonly",s=>s.get(space+"/"+name));return v&&typeof v.text==="string"?{text:v.text,etag:String(v.etag)}:null;},
  async write(space,name,text,etag){const k=space+"/"+name;const cur=await idbOp("readonly",s=>s.get(k));
    if(cur&&(etag==null||String(cur.etag)!==String(etag)))throw{code:"conflict"};if(!cur&&etag!=null)throw{code:"conflict"};
    const n=(cur?Number(cur.etag):0)+1;await idbOp("readwrite",s=>s.put({text,etag:n},k));return String(n);},
  async etags(){return null;},
  async putBlob(space,name,blob){const buf=await blob.arrayBuffer();await idbOp("readwrite",s=>s.put({buf,type:blob.type||"image/jpeg"},space+"/"+name));},
  async getBlob(space,name){const v=await idbOp("readonly",s=>s.get(space+"/"+name));return v&&v.buf?new Blob([v.buf],{type:v.type}):null;},
  async delBlob(space,name){await idbOp("readwrite",s=>s.delete(space+"/"+name));},
  async keys(){return await idbOp("readonly",s=>s.getAllKeys());},
  async clear(){await idbOp("readwrite",s=>s.clear());}
};
A.Local=Local;

/* ---------- サインイン(組合のアカウント) ---------- */
async function authInit(){
  if(!A.configured||!window.msal)return null;
  if(A.pca)return A.pca;
  const pca=new msal.PublicClientApplication({auth:{clientId:CFG.clientId,authority:"https://login.microsoftonline.com/"+CFG.tenantId,redirectUri:BASE_URL+"redirect.html",postLogoutRedirectUri:BASE_URL},cache:{cacheLocation:"localStorage"}});
  if(typeof pca.initialize==="function")await pca.initialize();
  A.pca=pca;
  let res=null;try{res=await pca.handleRedirectPromise();}catch(e){A.authError=e;}
  const accs=pca.getAllAccounts();
  A.account=(res&&res.account)||accs[0]||null;
  if(A.account&&pca.setActiveAccount)pca.setActiveAccount(A.account);
  return pca;
}
async function signIn(){const pca=await authInit();if(!pca)throw{code:"not_configured"};lss("jn-mode","m365");await pca.loginRedirect({scopes:scopes(),prompt:"select_account"});}
async function signOut(){["jn-mode","jn-join","jn-draft","jn-cal"].forEach(k=>lss(k,null));const pca=A.pca;if(pca&&A.account){try{await pca.logoutRedirect({account:A.account});return;}catch(e){}}location.href=BASE_URL;}
let tokP=null;
async function token(){
  if(!A.pca||!A.account)throw{code:"needs_reauth"};
  if(tokP)return tokP;
  tokP=(async()=>{try{const r=await A.pca.acquireTokenSilent({scopes:scopes(),account:A.account});return r.accessToken;}
    catch(e){const c=String((e&&e.errorCode)||"");
      if(/interaction_required|consent_required|login_required|invalid_grant|no_tokens_found|monitor_window_timeout|token_refresh_required/.test(c)||(e&&e.name==="InteractionRequiredAuthError")){
        try{await A.pca.acquireTokenRedirect({scopes:scopes(),account:A.account});}catch(e2){}
        await sleep(30000);}
      throw{code:"needs_reauth",detail:c};}
  })();
  try{return await tokP;}finally{setTimeout(()=>{tokP=null;},0);}
}
async function gfetch(path,opt,retry){opt=opt||{};retry=retry||0;const tok=await token();
  const h=Object.assign({Authorization:"Bearer "+tok},opt.headers||{});let r;
  try{r=await fetch(path.startsWith("http")?path:G+path,Object.assign({},opt,{headers:h}));}catch(e){throw{code:"network"};}
  if((r.status===429||r.status===503||r.status===504)&&retry<3){const w=Number(r.headers.get("Retry-After"))||2;await sleep(Math.min(w,10)*1000);return gfetch(path,opt,retry+1);}
  return r;}
function gerr(r){const s=r.status;return {code:s===401?"needs_reauth":s===403?"invalid_argument":s===507?"quota_exceeded":s===404?"not_found":(s===412||s===409)?"conflict":"upstream_error",status:s};}
A.gfetch=gfetch;A.gerr=gerr;

/* ---------- 組合のMicrosoft 365の置き場(OneDrive) ---------- */
const itemPath=(sp,name)=>`/drives/${enc(sp.drive)}/items/${enc(sp.id)}:/${enc(name)}:`;
const Graph={kind:"m365",
  async meta(space,name){const sp=A.spaces[space];if(!sp)return null;const r=await gfetch(itemPath(sp,name));if(r.status===404)return null;if(!r.ok)throw gerr(r);return await r.json();},
  async read(space,name){const it=await this.meta(space,name);if(!it)return null;
    const url=it["@microsoft.graph.downloadUrl"]||it["@content.downloadUrl"];let text;
    if(url){let d;try{d=await fetch(url);}catch(e){throw{code:"network"};}if(!d.ok)throw{code:"upstream_error",status:d.status};text=await d.text();}
    else{const d=await gfetch(itemPath(A.spaces[space],name)+"/content");if(!d.ok)throw gerr(d);text=await d.text();}
    return {text,etag:it.eTag};},
  async write(space,name,text,etag){const sp=A.spaces[space];if(!sp)throw{code:"invalid_argument"};
    /* 上書きの前に、ほかの人が先に書き換えていないかを確かめる(If-Matchと二重の守り) */
    if(etag!=null){const cur=await this.meta(space,name);if(!cur||cur.eTag!==etag)throw{code:"conflict"};}
    const h={"Content-Type":"text/plain"};let q="";if(etag!=null)h["If-Match"]=etag;else q="?@microsoft.graph.conflictBehavior=fail";
    const r=await gfetch(itemPath(sp,name)+"/content"+q,{method:"PUT",headers:h,body:text});if(!r.ok)throw gerr(r);const it=await r.json();return it.eTag;},
  async etags(space){const sp=A.spaces[space];if(!sp)return null;const r=await gfetch(`/drives/${enc(sp.drive)}/items/${enc(sp.id)}/children?$select=name,eTag&$top=200`);if(!r.ok)throw gerr(r);const j=await r.json();const m={};for(const x of j.value||[])m[x.name]=x.eTag;return m;},
  async putBlob(space,name,blob){const sp=A.spaces[space];const r=await gfetch(itemPath(sp,name)+"/content",{method:"PUT",headers:{"Content-Type":blob.type||"image/jpeg"},body:blob});if(!r.ok)throw gerr(r);},
  async getBlob(space,name){const it=await this.meta(space,name);if(!it)return null;const url=it["@microsoft.graph.downloadUrl"]||it["@content.downloadUrl"];if(!url)return null;const d=await fetch(url);return d.ok?await d.blob():null;},
  async delBlob(space,name){const sp=A.spaces[space];await gfetch(itemPath(sp,name),{method:"DELETE"});}
};
async function ensureFolder(name){
  let r=await gfetch(`/me/drive/root:/${enc(name)}`);
  if(r.status===404){r=await gfetch("/me/drive/root/children",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,folder:{},"@microsoft.graph.conflictBehavior":"fail"})});
    if(r.status===409)r=await gfetch(`/me/drive/root:/${enc(name)}`);}
  if(!r.ok)throw gerr(r);const it=await r.json();return {drive:it.parentReference.driveId,id:it.id,webUrl:it.webUrl||""};
}
async function openM365(){
  const r=await gfetch("/me?$select=id,displayName,mail,userPrincipalName");if(!r.ok)throw gerr(r);const u=await r.json();
  A.me={id:u.id,name:u.displayName||"",mail:u.mail||u.userPrincipalName||""};
  let join=null;try{join=JSON.parse(lsg("jn-join")||"null");}catch(e){}
  if(join&&join.drive&&join.id){
    const jr=await gfetch(`/drives/${enc(join.drive)}/items/${enc(join.id)}`);
    if(jr.ok){const it=await jr.json();const own=(it.createdBy&&it.createdBy.user)||{};
      if(own.id&&own.id===A.me.id){lss("jn-join",null);join=null;}
      else{A.owner=false;A.ownerName=own.displayName||"ほかの方";A.spaces={shared:{drive:join.drive,id:join.id}};lss("jn-join",JSON.stringify(join));}
    }else{lss("jn-join",null);A.joinFailed=true;join=null;}
  }
  if(!join){A.owner=true;A.spaces={shared:await ensureFolder(CFG.folder)};}
  A.backend=Graph;A.mode="m365";
}
A.captureJoin=function(){const m=location.hash.match(/^#join=([^&]+)&f=([^&]+)/);if(!m)return false;try{lss("jn-join",JSON.stringify({drive:decodeURIComponent(m[1]),id:decodeURIComponent(m[2])}));history.replaceState(null,"",location.pathname);}catch(e){}return true;};
A.signIn=signIn;A.signOut=signOut;A.authInit=authInit;A.openM365=openM365;
A.leaveJoin=()=>{lss("jn-join",null);location.href=BASE_URL;};

/* 共有: 相手に編集の権限を付け、入口のリンクを作る */
A.share={
  link(){const sp=A.spaces.shared;return `${BASE_URL}#join=${enc(sp.drive)}&f=${enc(sp.id)}`;},
  async invite(email,role){const sp=A.spaces.shared;const r=await gfetch(`/drives/${enc(sp.drive)}/items/${enc(sp.id)}/invite`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({recipients:[{email}],requireSignIn:true,sendInvitation:false,roles:[role==="read"?"read":"write"]})});if(!r.ok)throw gerr(r);return true;},
  async list(){const sp=A.spaces.shared;const r=await gfetch(`/drives/${enc(sp.drive)}/items/${enc(sp.id)}/permissions`);if(!r.ok)throw gerr(r);const j=await r.json();const out=[];
    for(const p of j.value||[]){if((p.roles||[]).includes("owner"))continue;const us=[];const g=p.grantedToV2||p.grantedTo;if(g&&g.user)us.push(g.user);for(const x of p.grantedToIdentitiesV2||p.grantedToIdentities||[])if(x&&x.user)us.push(x.user);
      if(!us.length)out.push({id:p.id,name:p.link?"リンクを知っている人":"(名前が分かりません)",mail:"",role:(p.roles||[])[0]||""});
      for(const u of us)out.push({id:p.id,name:u.displayName||u.email||"",mail:u.email||"",role:(p.roles||[])[0]||""});}
    return out;},
  async remove(pid){const sp=A.spaces.shared;const r=await gfetch(`/drives/${enc(sp.drive)}/items/${enc(sp.id)}/permissions/${enc(pid)}`,{method:"DELETE"});if(!r.ok&&r.status!==404)throw gerr(r);}
};

/* ---------- 帳面(1つの帳面=1つのファイル) ---------- */
function mapPath(path){const seg=String(path).split("/").filter(Boolean);
  if(seg[0]==="shared"&&seg[1]==="main")return {space:"shared",name:seg.slice(2).join("-")};
  if(seg[0]==="data"&&seg[1]==="users")return {space:"private",name:seg.slice(3).join("-")};
  return {space:"shared",name:seg.join("-")};}
const files={};
function fileOf(space,name){const k=space+"/"+name;return files[k]||(files[k]={space,name:name+".json",docs:{},etag:null,loaded:false,loading:null,pending:[],flushing:null,subs:new Set(),errSubs:new Set()});}
function emit(f){for(const fn of f.subs){try{fn();}catch(e){}}}
function parseFile(text){try{const j=JSON.parse(text);return j&&j.docs&&typeof j.docs==="object"?j.docs:{};}catch(e){return {};}}
function applyOps(docs,ops){const d=Object.assign({},docs);for(const o of ops){if(o.body===null)delete d[o.id];else d[o.id]=o.body;}return d;}
async function load(f,force){
  if(f.loaded&&!force)return;if(f.loading)return f.loading;
  f.loading=(async()=>{try{if(!A.spaces[f.space]&&A.backend.kind==="m365"){f.docs={};f.etag=null;f.loaded=true;return;}
      const r=await A.backend.read(f.space,f.name);const base=r?parseFile(r.text):{};f.remote=base;f.etag=r?r.etag:null;f.docs=applyOps(base,f.pending);f.loaded=true;emit(f);}
    finally{f.loading=null;}})();

async function flush(f){
  if(f.flushing)return f.flushing;

    for(let tries=0;f.pending.length;tries++){
      const ops=f.pending.slice();const next=applyOps(f.remote||{},ops);
      try{const et=await A.backend.write(f.space,f.name,JSON.stringify({v:1,docs:next}),f.etag);f.etag=et;f.remote=next;f.pending=f.pending.slice(ops.length);}

  await sleep(0);while(f.flushing)await f.flushing.catch(()=>{});if(f.pending.includes(op))await flush(f).catch(()=>{});if(op.err)throw op.err;}

      for(const d of snap.docs){if(have.has(d.id))continue;await col(c).doc(d.id).set({...d.data(),createdBy:S.uid,updatedBy:S.uid});n++;if(n%25===0)toast(`以前の記録を移しています(${n}件)`);}
    }
    await flag.set({migratedAt:now(),count:n});
    if(n)toast(`以前の記録 ${n}件を、共有できる置き場へ移しました`,4500);
  }catch(e){}
}

function renderMain(full){
  document.querySelectorAll("nav.tabs button").forEach(b=>{if(b.dataset.tab===S.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
  const kb=$("#btn-kokoro");if(kb){if(S.tab==="kokoro")kb.setAttribute("aria-current","page");else kb.removeAttribute("aria-current");}
  const tb=$("#btn-today");if(tb){if(S.tab==="today")tb.setAttribute("aria-current","page");else tb.removeAttribute("aria-current");}
  if(!S.db)return;
  const t=S.tab;
  if(t==="home"){if(full||!$("#capture"))renderHome();else{renderHomeSummary();renderRecent();}}

function deskDue(){const t=today(),lim=addDays(t,7);let od=0,soon=0;for(const x of S.desk.tasks){if(!tOpen(x)||!x.due)continue;if(x.due<t)od++;else if(x.due<=lim)soon++;}return {od,soon};}
function nextEvToday(){const d=today();const c=S.cal[d];if(!c||!c.events)return null;const nt=new Date();const nowS=`${d}T${pad(nt.getHours())}:${pad(nt.getMinutes())}`;return c.events.filter(e=>!evInfo(e).off&&!e.isAllDay).find(e=>e.end>nowS)||null;}
function todayScene(){const e=nextEvToday();if(!e)return "";const sc=sceneOf(e);if(sc==="いつも")return "";return princSorted("active").some(p=>p.scene===sc)?sc:"";}
function todayPrinc(){let a=princSorted("active");if(!a.length)return null;const sc=todayScene();if(sc)a=a.filter(p=>p.scene===sc);const n=Math.floor(parseD(today()).getTime()/86400000);return a[((n%a.length)+a.length)%a.length];}
function firstKDate(){const ds=[...S.guide,...S.princ].map(x=>String(x.createdAt||"").slice(0,10)).filter(Boolean).sort();return ds[0]||null;}
function reviewDue(){if(!showK()||S.kroot==null)return false;const base=S.kroot.lastReviewAt||firstKDate();return !!base&&daysSince(base)>=14;}

function orgOptsHTML(opts,q){
  if(!opts.length)return `<option value="">(組織はまだ登録されていません。「回り具合」で追加できます)</option>`;

  if(!n)return `<option value="">＋組織・職場・学区を選ぶ</option>`+opts.map(({o,depth})=>`<option value="${esc(o.id)}">${"　".repeat(depth)}${esc(o.name)}</option>`).join("");
  const hit=opts.filter(({o})=>norm(o.name).includes(n));
  return `<option value="">${hit.length?`＋当てはまる${hit.length}件から選ぶ`:"当てはまる名前がありません"}</option>`+hit.map(({o})=>`<option value="${esc(o.id)}">${esc(orgPath(o.id))}</option>`).join("");

function bindPersonPicker(pfx,people,changed,orgIds){
  const q=$(`#${pfx}-pq`),sug=$(`#${pfx}-psug`);
  $(`#${pfx}-prec`)?.addEventListener("click",e=>{const b=e.target.closest("[data-pid]");if(!b)return;const p=idx().pMap[b.dataset.pid];if(p&&!people.some(x=>x.id===p.id))people.push({id:p.id,name:p.name});changed("chip");});
  const show=()=>{const v=q.value.trim();if(!v){sug.innerHTML="";return;}
    const hits=rankPeople(matchPeople(v).filter(p=>!people.some(x=>x.id===p.id)),orgIds).slice(0,6);
    sug.innerHTML=`<div class="suggest">${hits.map(p=>`<button type="button" data-pid="${esc(p.id)}"><b>${esc(p.name)}</b> <span class="small muted">${esc(personLabel(p))}${p._last?` ・前回 ${esc(md(p._last))}`:""}</span></button>`).join("")}<button type="button" data-new="1">＋「${esc(v)}」を新しい人として追加</button></div>`;};
  q.addEventListener("input",show);
  q.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const b=sug.querySelector("button");if(b)b.click();}});
  sug.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.pid){const p=idx().pMap[b.dataset.pid];people.push({id:p.id,name:p.name});}
    else people.push({id:null,name:q.value.trim(),org:"",title:"",kana:""});
    changed("typed");});
  $(`#${pfx}-pchips`).addEventListener("click",e=>{const b=e.target.closest("[data-prm]");if(!b)return;people.splice(+b.dataset.prm,1);changed();});
}
function norm(s){return String(s||"").replace(/\s|　/g,"").toLowerCase();}
function matchPeople(v){const n=norm(v);return S.people.filter(p=>norm(p.name).includes(n)||norm(p.kana).includes(n)||norm(p.org).includes(n)||norm(p.title).includes(n));}

/* AIで整理 */
async function aiOrganize(){
  const d=S.draft,btn=$("#d-ai"),busy=$("#d-busy");
  if(!d.memo.trim()){toast("先に、話したことを書いてください");$("#d-memo").focus();return;}
  btn.disabled=true;busy.innerHTML=`<span class="busy">整理しています(10〜60秒)</span>`;
  const people=S.people.slice(0,400).map(p=>`${p.id}|${p.name}|${p.kana||""}|${p.org||""}|${p.title||""}`).join("\n");
  const orgs=flatOrgs().slice(0,600).map(({o})=>`${o.id}|${orgPath(o.id)}`).join("\n");
  const prompt=`あなたは、くらしの相談担当の「面会記録」を整理する秘書です。下の口述メモ(音声入力のため誤変換や言い淀みを含みます)を読み、JSONだけを返してください。
今日の日付: ${today()}
ルール:
- メモに書かれていないことを足さない。人名・数字・期限を推測で作らない。
- 「voices(声)」= 相手から受けた意見・要望・困りごと。「promises(約束)」= メモの書き手(本人)が相手に「します」と言ったこと。
- 人物: 既存の人物リストに同じ人がいれば matchId にそのIDを入れる(氏名が一致し、所属も矛盾しない場合だけ)。いなければ null。名前の分からない人は入れない。
- orgIds: 組織リストに該当があればそのIDだけを入れる。無ければ空配列。
- 相手の考え方を「〇〇派」などと決めつけない。発言の内容として書く。
- 日付は「昨日」「先週金曜」なども今日を基準に YYYY-MM-DD にする。メモに日付が無ければ null。
- 人数が述べられていれば headcount に数字で入れる(例:「今日は12人」→12)。大勢の場で目安しか無ければその目安。
- 録音の文字起こしが貼られている場合は、書き手(ご本人)の発言と相手の発言を区別して、相手の意見・要望を voices に、ご本人の「〜します」を promises に入れる。
- 「guides(指導)」= 相手から書き手(ご本人)自身に向けられた助言・注意・評価・相手の読み方(例:「〜した方がいい」「君は〜が長所だ」「〇〇の人たちは〜だから気をつけて」)。行政・会社・組合への要望は voices に入れ、guides には入れない。kind は stance(姿勢・スタンス)/self(長所・短所)/read(相手の読み方・作法)/plan(作戦)。第三者の人柄の評価や、思想・信条・健康・家族の事情は書かない。無ければ空配列。
- summary と voices には guides の中身を書かない(指導は本人だけが見る帳面に入るため)。
- tags は政策分野の短い言葉(例: 交通・道路、子育て、教育、医療・介護、防災、雇用・賃金、産業・ものづくり、環境、地域・自治、くらし)。
形式:
{"date":null,"kind":"one|talk|greet|training|speech|event|other","place":"","headcount":null,"summary":"要点を1〜2文","people":[{"matchId":null,"name":"","org":"","title":""}],"orgIds":[],"voices":[{"text":"","from":"氏名か空文字"}],"promises":[{"text":"","to":"氏名か空文字","due":null}],"guides":[{"text":"","from":"氏名か空文字","kind":"stance"}],"tags":[]}
kind の意味: one=1対1・少人数、talk=職場トーク・会議、greet=工場前などのあいさつ運動、training=研修でのあいさつ、speech=あいさつ・大人数、event=行事・式典・定期大会、other=その他

既存の人物(ID|氏名|よみ|所属|役割):
${people||"(なし)"}

組織(ID|名前):
${orgs||"(なし)"}

口述メモ:
${d.memo}`;
  try{
    const r=await S.sample.json(prompt,{cache:false});
    applyAI(r);
    toast("整理しました。中身を確かめて「保存する」を押してください",4000);
  }catch(e){
    const m={not_granted:"AIの利用が許可されていません。",rate_limited:"少し時間をおいてもう一度押してください。",invalid_json:"うまく整理できませんでした。もう一度押すか、自分で入力してください。"}[e?.code]||"整理できませんでした。もう一度押すか、自分で入力してください。";
    toast(m,4500);
  }finally{btn.disabled=false;busy.innerHTML="";}
}
function applyAI(r){
  if(!r||typeof r!=="object")throw{code:"invalid_json"};
  const d=S.draft;d.structured=true;
  if(r.date&&/^\d{4}-\d{2}-\d{2}$/.test(r.date))d.date=r.date;
  if(KIND[r.kind])d.kind=r.kind;
  if(r.place)d.place=String(r.place);
  if(r.headcount!=null&&!isNaN(+r.headcount))d.headcount=String(r.headcount);
  if(r.summary)d.summary=String(r.summary);
  const pm=idx().pMap;
  for(const p of (Array.isArray(r.people)?r.people:[])){
    if(!p||!p.name)continue;
    const ex=p.matchId&&pm[p.matchId];
    const name=ex?ex.name:String(p.name);
    if(d.people.some(x=>(ex&&x.id===ex.id)||norm(x.name)===norm(name)))continue;
    d.people.push(ex?{id:ex.id,name:ex.name}:{id:null,name,org:p.org||"",title:p.title||"",kana:""});
  }
  const om=idx().orgMap;for(const o of (Array.isArray(r.orgIds)?r.orgIds:[]))if(om[o]&&!d.orgIds.includes(o))d.orgIds.push(o);
  const whoIdx=n=>{if(!n)return"";const i=d.people.findIndex(x=>norm(x.name)===norm(n)||norm(n).includes(norm(x.name)));return i>=0?String(i):"";};
  for(const v of (Array.isArray(r.voices)?r.voices:[]))if(v&&v.text)d.voices.push({text:String(v.text),who:whoIdx(v.from)});
  for(const v of (Array.isArray(r.promises)?r.promises:[]))if(v&&v.text)d.promises.push({text:String(v.text),who:whoIdx(v.to),due:/^\d{4}-\d{2}-\d{2}$/.test(v.due||"")?v.due:""});
  if(!Array.isArray(d.guides))d.guides=[];
  if(showK())for(const v of (Array.isArray(r.guides)?r.guides:[]))if(v&&v.text)d.guides.push({text:String(v.text),who:whoIdx(v.from),kind:GK[v.kind]?v.kind:"stance"});
  if(Array.isArray(r.tags)&&r.tags.length){const cur=d.tags?d.tags.split(/[、,]/).map(s=>s.trim()).filter(Boolean):[];for(const t of r.tags)if(t&&!cur.includes(t))cur.push(String(t));d.tags=cur.join("、");}
  saveDraft();renderCapture();$("#d-struct").scrollIntoView({behavior:"smooth",block:"start"});
}
const splitTags=s=>String(s||"").split(/[、,]/).map(x=>x.trim()).filter(Boolean);
async function saveCapture(){
  const d=S.draft,btn=$("#d-save");
  if(!d.date){toast("日付を入れてください");return;}
  if(!d.summary.trim()&&!d.memo.trim()&&!d.people.length&&!d.voices.length&&!(d.guides||[]).length){toast("中身が空です");return;}
  btn.disabled=true;btn.textContent="保存しています";
  try{
    const pids=[];
    for(const p of d.people){
      if(p.id){pids.push(p.id);continue;}
      const id=newId();let photo="";
      if(p.photoData&&S.assets){try{photo=await uploadPhoto(await dataURLToBlob(p.photoData));}catch(e){}}
      await put("people",{id,name:p.name,kana:p.kana||"",org:p.org||"",title:p.title||"",orgId:d.orgIds[0]||"",phone:p.phone||"",email:p.email||"",address:p.address||"",introducedBy:"",interests:"",note:"",important:false,photo,photoSource:photo?"名刺の写真":"",createdAt:now(),updatedAt:now()});
      p.id=id;pids.push(id);
    }
    const cid=newId(),tags=splitTags(d.tags);
    const privMemo=showK()&&(d.guides||[]).some(v=>v.text.trim())&&!!d.memo.trim();
    await put("contacts",{id:cid,date:d.date,kind:d.kind,place:d.place.trim(),headcount:d.headcount===""?null:Number(d.headcount),orgIds:d.orgIds,personIds:pids,summary:d.summary.trim(),memo:privMemo?"":d.memo.trim(),tags,createdAt:now()});
    if(privMemo)await kput("memos",{id:cid,memo:d.memo.trim(),createdAt:now()});
    const who=w=>w===""||w==null?[]:(d.people[+w]?.id?[d.people[+w].id]:[]);
    for(const v of d.voices)if(v.text.trim())await put("items",{id:newId(),type:"voice",text:v.text.trim(),personIds:who(v.who),contactId:cid,status:"open",due:addDays(d.date,7),linkTo:"",tags,log:[],createdAt:now(),updatedAt:now()});
    for(const v of d.promises)if(v.text.trim())await put("items",{id:newId(),type:"promise",text:v.text.trim(),personIds:who(v.who),contactId:cid,status:"open",due:v.due||addDays(d.date,7),linkTo:"",tags,log:[],createdAt:now(),updatedAt:now()});
    if(showK())for(const v of (d.guides||[]))if(v.text.trim())await kput("guidance",{id:newId(),date:d.date,kind:GK[v.kind]?v.kind:"stance",text:v.text.trim(),mine:"",personIds:who(v.who),fromOrgIds:[],from:"",contactId:cid,aboutOrgIds:[],aboutPersonIds:[],status:"new",principleId:"",thankedAt:"",reportedAt:"",caution:false,source:"notebook",log:[],createdAt:now(),updatedAt:now()});
    S.draft=emptyDraft();ls("jn-draft",null);
    toast("保存しました");renderCapture();window.scrollTo({top:0,behavior:"smooth"});
  }catch(e){toast(dbErr(e),5000);btn.disabled=false;btn.textContent="保存する";saveDraft();}
}

const PHOTO_OK_TEXT="本人の了解を得て撮った写真、名刺に印刷された写真、本人から受け取った写真、または組合の刊行物に載っている写真です";
function avatar(p,cls="av-sm"){
  if(p&&p.photo)return `<img class="av ${cls}" src="${esc(JNAPP.blobSrc(p.photo))}" data-blob="${esc(p.photo)}" alt="${esc(p.name)}さんの顔写真" loading="lazy">`;
  if(p&&p.photoData&&String(p.photoData).startsWith("data:image/"))return `<img class="av ${cls}" src="${esc(p.photoData)}" alt="${esc(p.name)}さんの顔写真" loading="lazy">`;
  return `<span class="av ${cls}" aria-hidden="true">${esc(String(p?.name||"?").trim().charAt(0))}</span>`;
}
async function loadBitmap(blob){try{return await createImageBitmap(blob);}catch(e){return await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(blob);});}}
async function cropSquare(src,sx,sy,side,size=320){
  const c=document.createElement("canvas");c.width=size;c.height=size;
  c.getContext("2d").drawImage(src,sx,sy,side,side,0,0,size,size);
  return await new Promise(res=>c.toBlob(b=>res(b),"image/jpeg",.86));
}
async function cropFromFraction(blob,f){
  const bmp=await loadBitmap(blob);const W=bmp.width,H=bmp.height;
  const cx=(f.x+f.w/2)*W,cy=(f.y+f.h/2)*H;let side=Math.max(f.w*W,f.h*H)*1.15;side=Math.min(side,W,H);
  const sx=Math.max(0,Math.min(W-side,cx-side/2)),sy=Math.max(0,Math.min(H-side,cy-side/2));
  return await cropSquare(bmp,sx,sy,side);
}
const blobToDataURL=b=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(b);});
async function dataURLToBlob(u){return await (await fetch(u)).blob();}
async function uploadPhoto(blob){
  if(!S.assets)throw{code:"not_granted"};
  const r=await S.assets.upload(blob,{type:"image/jpeg"});return r.id;
}
async function setPersonPhoto(p,blob,source){
  const id=await uploadPhoto(blob);
  const old=p.photo;
  await put("people",{...stripPriv(p),photo:id,photoData:"",photoSource:source||"",photoAt:now(),updatedAt:now()});
  if(old)S.assets.delete(old).catch(()=>{});
}
function pickPhotoFor(p){

  const inp=document.createElement("input");inp.type="file";inp.accept="image/*";

function cropSheet(p,blob){
  const url=URL.createObjectURL(blob);
  const html=`<div class="stack">
    <p class="small muted" style="margin:0">丸の中に${esc(p.name)}さんの顔が入るように、写真の上をなぞって動かしてください。大きさは下のつまみで変えられます。</p>
    <div style="text-align:center"><div class="cropbox" id="cr-box"><img id="cr-img" src="${url}" alt="選んだ写真"><div id="cr-sel"></div></div></div>
    <label class="f"><span>丸の大きさ</span><input type="range" id="cr-size" min="10" max="100" value="45" style="width:100%"></label>
    <div class="row"><canvas id="cr-prev" class="cr-prev" width="84" height="84" aria-label="仕上がりの見本"></canvas><span class="small muted">仕上がりの見本</span></div>
    <label class="f"><span>写真の出どころ</span><select id="cr-src"><option>一緒に撮った写真(本人の了解あり)</option><option>名刺の写真</option><option>本人から受け取った写真</option><option>組合の刊行物</option></select></label>
    <label class="row small" style="align-items:flex-start;flex-wrap:nowrap"><input type="checkbox" id="cr-ok" style="margin-top:4px;flex:none"><span>${PHOTO_OK_TEXT}</span></label>
    <div class="row"><button type="button" class="btn primary" id="cr-save" disabled>この写真にする</button><button type="button" class="btn ghost" id="cr-cancel">やめる</button></div>
  </div>`;
  openSheet({mode:"edit",title:"顔写真",html,bind:root=>{
    const img=root.querySelector("#cr-img"),box=root.querySelector("#cr-box"),sel=root.querySelector("#cr-sel"),size=root.querySelector("#cr-size"),prev=root.querySelector("#cr-prev"),ok=root.querySelector("#cr-ok"),save=root.querySelector("#cr-save");
    let cx=.5,cy=.4;
    const geom=()=>{const w=img.clientWidth,h=img.clientHeight;const side=Math.min(w,h)*size.value/100;
      const x=Math.max(0,Math.min(w-side,cx*w-side/2)),y=Math.max(0,Math.min(h-side,cy*h-side/2));return {w,h,side,x,y};};
    const draw=()=>{const g=geom();if(!g.w)return;sel.style.width=g.side+"px";sel.style.height=g.side+"px";sel.style.left=g.x+"px";sel.style.top=g.y+"px";
      const k=img.naturalWidth/g.w;const ctx=prev.getContext("2d");ctx.clearRect(0,0,84,84);ctx.drawImage(img,g.x*k,g.y*k,g.side*k,g.side*k,0,0,84,84);};
    img.addEventListener("load",draw);if(img.complete)draw();
    size.addEventListener("input",draw);
    let drag=false;
    const move=e=>{const r=img.getBoundingClientRect();cx=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));cy=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));draw();};
    box.addEventListener("pointerdown",e=>{drag=true;box.setPointerCapture(e.pointerId);move(e);});
    box.addEventListener("pointermove",e=>{if(drag)move(e);});
    box.addEventListener("pointerup",()=>{drag=false;});box.addEventListener("pointercancel",()=>{drag=false;});
    ok.addEventListener("change",()=>{save.disabled=!ok.checked;});
    root.querySelector("#cr-cancel").addEventListener("click",()=>{URL.revokeObjectURL(url);openSheet({mode:"view",kind:"person",id:p.id});});
    save.addEventListener("click",async()=>{save.disabled=true;save.textContent="保存しています";
      try{const g=geom();const k=img.naturalWidth/g.w;const out=await cropSquare(img,g.x*k,g.y*k,g.side*k);
        await setPersonPhoto(p,out,root.querySelector("#cr-src").value);URL.revokeObjectURL(url);toast("顔写真を入れました");openSheet({mode:"view",kind:"person",id:p.id});}
      catch(e){save.disabled=false;save.textContent="この写真にする";toast(e?.code==="not_granted"?"写真を入れる権限がありません":"保存できませんでした。もう一度押してください",5000);}});
  }});
}

/* 名刺の読み取り */
async function toJpeg(file){
  try{const bmp=await createImageBitmap(file);const max=1800,sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),"image/jpeg",.88));}catch(e){return file;}
}
function pickCards(mode){
  if(!S.sample){toast("この版では、名刺の読み取りは使えません");return;}
  const inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.multiple=true;
  inp.addEventListener("change",async()=>{const files=[...inp.files];if(files.length)readCards(files,mode);});
  inp.click();
}
async function readCards(files,mode){
  let lim=null;try{lim=await S.sample.limits();}catch(e){}
  if(!lim?.images){toast("この画面では写真を送れません");return;}
  const max=lim.images.maxCount||5;
  if(files.length>max){toast(`一度に送れる写真は${max}枚までです。先頭の${max}枚を読みます`,4000);files=files.slice(0,max);}
  openSheet({mode:"busy",title:"名刺を読み取っています",html:`<p class="busy">写真を読んでいます(10〜60秒)</p><p class="small muted">名刺を何枚か並べて1枚の写真に撮っても読めます。</p>`});
  try{
    const blobs=[];for(const f of files)blobs.push(await toJpeg(f));
    const r=await S.sample.json(`写真に写っている名刺をすべて読み取り、JSON配列だけを返してください。1枚につき1つのオブジェクトです。
{"name":"氏名","kana":"よみがな(ローマ字表記しか無ければ空)","org":"会社・団体名","dept":"部署","title":"役職","phone":"電話","email":"メール","address":"住所","image":0,"face":null}
読めない項目は空文字にする。推測で埋めない。名刺でないものは無視する。名刺が無ければ [] を返す。
image は、その名刺が写っている写真の番号(1枚目が0)。
face は、その名刺に顔写真が印刷されている場合だけ、写真全体に対する位置を0〜1の割合で {"x":左端,"y":上端,"w":幅,"h":高さ} の形で入れる。印刷された顔写真が無ければ null。人物が誰かを推測したり、名刺以外に写っている人の顔の位置は返さない。`,{images:blobs,cache:false});
    const cards=(Array.isArray(r)?r:[]).filter(c=>c&&c.name).map(c=>({name:String(c.name).trim(),kana:c.kana||"",org:[c.org,c.dept].filter(Boolean).join(" "),title:c.title||"",phone:c.phone||"",email:c.email||"",address:c.address||"",use:true,face:c.face,image:Number.isInteger(c.image)?c.image:0}));
    for(const c of cards){const f=c.face;if(f&&[f.x,f.y,f.w,f.h].every(v=>typeof v==="number"&&v>=0&&v<=1)&&f.w>0.01&&f.h>0.01&&blobs[c.image]){try{const b=await cropFromFraction(blobs[c.image],f);c.photoData=await blobToDataURL(b);c.usePhoto=true;}catch(e){}}}
    if(!cards.length){openSheet({mode:"busy",title:"名刺が見つかりませんでした",html:`<p>写真から名刺を読み取れませんでした。明るい場所で、名刺が画面いっぱいになるように撮り直してください。</p>`});return;}
    reviewCards(cards,mode);
  }catch(e){closeSheet();toast(e?.code==="rate_limited"?"少し時間をおいてもう一度試してください":"読み取れませんでした。撮り直してもう一度試してください",4500);}
}
function reviewCards(cards,mode){
  const dupOf=c=>S.people.find(p=>norm(p.name)===norm(c.name));

/* 絞り込み: 場の種類・期間・組織。画面には「絞り込み」ボタン1つと、かけている条件だけを出す */
const PERIODS=[["all","すべて"],["m0","今月"],["m1","先月"],["d90","3か月"]];
function emptyFil(){return {kinds:[],period:"all",orgId:""};}
function filCount(f=S.logFil){return f.kinds.length+(f.period!=="all"?1:0)+(f.orgId?1:0);}
function periodRange(p){const t=parseD(today());if(p==="m0")return [ymd(new Date(t.getFullYear(),t.getMonth(),1)),"9999"];if(p==="m1")return [ymd(new Date(t.getFullYear(),t.getMonth()-1,1)),ymd(new Date(t.getFullYear(),t.getMonth(),0))];if(p==="d90")return [addDays(today(),-90),"9999"];return ["","9999"];}
function applyFil(cs,f=S.logFil){if(!filCount(f))return cs;const [a,b]=periodRange(f.period);const oids=f.orgId?new Set(descIds(f.orgId)):null;
  return cs.filter(c=>(!f.kinds.length||f.kinds.includes(c.kind))&&(c.date||"")>=a&&(c.date||"")<=b&&(!oids||(c.orgIds||[]).some(o=>oids.has(o))));}
function filChips(){const f=S.logFil,out=[];for(const k of f.kinds)out.push(`<span class="chip">${esc(KIND[k]||k)}<button type="button" aria-label="${esc(KIND[k]||k)}を外す" data-fx="kind:${k}">×</button></span>`);
  if(f.period!=="all")out.push(`<span class="chip">${esc(PERIODS.find(x=>x[0]===f.period)[1])}<button type="button" aria-label="期間を外す" data-fx="period">×</button></span>`);
  if(f.orgId)out.push(`<span class="chip">${esc(idx().orgMap[f.orgId]?.name||"(消された組織)")}<button type="button" aria-label="組織を外す" data-fx="org">×</button></span>`);return out.join("");}

    <div><div class="qlabel">組織・職場・学区(下の組織も含めます)</div>${orgPickerHTML("f",f.orgId?[f.orgId]:[])}</div>
    <div class="savebar" style="bottom:0"><button type="button" class="btn primary" id="lf-go">${n}件を表示</button><button type="button" class="linkish small" id="lf-clear" style="padding:10px 4px">条件をすべて外す</button></div>

async function askMessage(who,list){

  const prompt=`労働組合の仲間である${who}に、Teamsのチャットで送る短い確認のお願いを1通書いてください。送り主は、くらしの相談担当です。

書き方の決まり:
- 最初に、段取りしてもらったことへの具体的なお礼を一言。
- 記録が追いついていないのは送り主側の事情として書く。相手の管理を責める書き方や「把握されていますか」のような詰める言い方はしない。
- 相手の手間を最小にする: 「だいたいで大丈夫」「実施報告書・出欠表・お弁当の数など、手元のものを転送や写真で送ってもらえれば、こちらで拾います」「分からない回は空欄で大丈夫」を必ず入れる。

- 締め切りは書かない。「お手すきの時で」。

- 200〜350字程度、平易で丁寧な日本語。署名は名字だけ。
一覧:
${rows}`;
  try{const {text}=await S.sample(prompt,{cache:false});

つなぎ先: ${it.linkTo||"(なし)"}
経過:
${(it.log||[]).map(l=>`${l.date} ${l.note}`).join("\n")||"(まだなし)"}`;

/* ----- 回り具合 ----- */
const COV_TARGET=0.3;
const PRI={high:["今行きたい","high"],mid:["そのうち","mid"],low:["後回し","low"]};
function coverData(){
  if(S._cov&&S._covVer===S.ver)return S._cov;
  const {byOrg,orgMap}=idx();const m={};
  const calc=id=>{
    if(m[id])return m[id];
    const o=orgMap[id];const kids=orgChildren(id);
    const recs=new Map();for(const c of byOrg[id]||[])recs.set(c.id,c);
    for(const k of kids){for(const c of calc(k.id).recs.values())recs.set(c.id,c);}
    let heads=0,last=null,unk=0,n=0,abs=0;const k={talk:0,greet:0,training:0};
    for(const c of recs.values()){
      if(c.absent){abs++;continue;}
      n++;
      if(c.kind in k)k[c.kind]++;
      heads+=hcOf(c)||0;
      if(isUnk(c))unk++;
      if(!last||c.date>last)last=c.date;
    }
    const members=o&&o.members!=null&&o.members!==""?Number(o.members):kids.reduce((a,x)=>a+(calc(x.id).members||0),0);
    const ids=new Set(descIds(id));
    m[id]={recs,n,abs,heads,last,unk,k,members,people:S.people.filter(p=>ids.has(p.orgId)).length,
      cov:members>0?heads/members:null,ds:last?daysSince(last):null};
    return m[id];
  };
  for(const o of S.orgs)calc(o.id);
  const score=st=>{const f=st.ds==null?1:0.2+0.8*Math.min(Math.max(st.ds,0),90)/90;return st.members*(1-Math.min((st.cov||0)/COV_TARGET,1))*f;};
  const rank=list=>{list.sort((a,b)=>b.score-a.score);const nH=Math.max(1,Math.round(list.length*0.2)),nM=Math.round(list.length*0.3);
    list.forEach((x,i)=>{m[x.id].pri=i<nH?"high":i<nH+nM?"mid":"low";m[x.id].score=x.score;m[x.id].rank=i+1;});};
  const isLeaf=o=>!orgChildren(o.id).length&&o.members>0;
  rank(S.orgs.filter(isLeaf).map(o=>({id:o.id,score:score(m[o.id])})));
  const parents=S.orgs.filter(o=>orgChildren(o.id).some(isLeaf));
  for(const p of parents){const ch=orgChildren(p.id).filter(isLeaf);m[p.id].kidN=ch.length;m[p.id].hiKids=ch.filter(x=>m[x.id].pri==="high").length;m[p.id].touchedKids=ch.filter(x=>m[x.id].n>0).length;}
  rank(parents.map(p=>({id:p.id,score:orgChildren(p.id).filter(isLeaf).reduce((a,x)=>a+m[x.id].score,0)})));
  S._cov=m;S._covVer=S.ver;return m;
}
const pct=v=>v==null?"":(v*100<1&&v>0?"1%未満":`${Math.round(v*100)}%`);
const agoTxt=st=>st.last?`最後 ${md(st.last)}(${st.ds===0?"今日":st.ds+"日前"})`:"まだ行っていない";
function reasonTxt(st){return `在住${st.members.toLocaleString()}人、接触${pct(st.cov)||"0%"}、${st.last?(st.ds===0?"今日行った":st.ds+"日前"):"まだ行っていない"}`;}
function renderCoverTree(){
  const m=coverData();
  const leaves=S.orgs.filter(o=>!orgChildren(o.id).length&&o.members>0);
  const touched=leaves.filter(o=>m[o.id].n>0).length;
  let tm=0,th=0;for(const o of orgChildren("")){const st=m[o.id];if(st.members>0){tm+=st.members;th+=st.heads;}}
  const tu=S.contacts.filter(isUnk).length;
  const cand=leaves.filter(o=>m[o.id].pri!=="low").sort((a,b)=>m[b.id].score-m[a.id].score).slice(0,10);
  const roots=orgChildren("");
  $("#main").innerHTML=`<h2>回り具合</h2>
  <details class="panel small" style="padding:0 14px"><summary style="padding:12px 0;min-height:44px;cursor:pointer">見方(帯の長さと色の意味)</summary><div class="stack" style="padding:0 0 12px">
    <div><b>帯の長さ</b> = 延べ接触率(延べ人数 ÷ 在住者数)が、目標の${Math.round(COV_TARGET*100)}%にどこまで近づいたか。帯が端まで届けば目標達成です。同じ人に何度会っても数えるので、目安です。</div>
    <div><b>帯の色</b> = 行く優先度。在住者が多いほど、接触率が低いほど、最後に行ってから日がたつほど高くなります。</div>
    <div class="row" style="gap:8px"><span class="badge pb-high">今行きたい</span><span class="badge pb-mid">そのうち</span><span class="badge pb-low">後回し</span><span class="muted">全職場の中の順位で、上位2割が「今行きたい」、次の3割が「そのうち」、残りが「後回し」(在住者が少ない職場は、接触0%でも後回しになることがあります)</span></div>
  </div></details>
  ${leaves.length?`<div class="panel" style="margin-top:10px"><div class="row" style="gap:18px">
    <div><b style="font-family:var(--serif);font-size:1.4rem">${touched} / ${leaves.length}</b> <span class="muted small">記録のある職場・組合</span></div>
    <div><b style="font-family:var(--serif);font-size:1.4rem">${pct(tm?th/tm:0)||"0%"}</b> <span class="muted small">全体の延べ接触率(${th.toLocaleString()} / ${tm.toLocaleString()}人、目標${Math.round(COV_TARGET*100)}%)</span></div>
    ${tu?`<div><button type="button" class="sumbtn" data-recs="" data-rf="unk">人数未確認 ${tu}件</button> <span class="muted small">押すと一覧が出て、その場で人数を入れられます</span></div>`:""}</div></div>`:""}
  ${cand.length?`<h3>次に行く候補</h3><ol class="list panel cand" style="padding:0 12px">${cand.map(o=>{const st=m[o.id];return `<li><button type="button" data-reveal="${esc(o.id)}"><span class="row" style="gap:8px"><span class="badge pb-${st.pri}">${PRI[st.pri][0]}</span><span class="t">${esc(o.name)}</span><span class="s">${esc(idx().orgMap[o.parentId]?.name||"")}</span></span><span class="s" style="display:block">${esc(reasonTxt(st))}</span></button></li>`;}).join("")}</ol>`:""}
  <div class="row" style="margin-top:14px;justify-content:space-between">
    <div class="seg" role="group" aria-label="並び順"><button type="button" data-csort="order" aria-pressed="${S.coverSort!=="pri"}">元の順</button><button type="button" data-csort="pri" aria-pressed="${S.coverSort==="pri"}">優先度順</button></div>
    <div class="row" style="gap:6px"><button type="button" class="btn small" id="o-openall">すべて開く</button><button type="button" class="btn small" id="o-closeall">すべて閉じる</button><button type="button" class="btn small w-only" id="o-add">＋組織を追加</button></div>
  </div>
  <div style="margin-top:6px">${roots.length?`<ul class="tree">${roots.map(treeNode).join("")}</ul>`:`<p class="muted">まだ組織がありません。</p>`}</div>`;
  const root=$("#main");
  $("#o-add").addEventListener("click",()=>orgEdit(null,""));
  root.querySelectorAll("[data-csort]").forEach(b=>b.addEventListener("click",()=>{S.coverSort=b.dataset.csort;renderCover();}));
  $("#o-openall").addEventListener("click",()=>{for(const o of S.orgs)if(orgChildren(o.id).length)S.orgOpen[o.id]=true;renderCover();});
  $("#o-closeall").addEventListener("click",()=>{for(const o of S.orgs)if(orgChildren(o.id).length)S.orgOpen[o.id]=false;renderCover();});
  root.querySelectorAll("[data-tog]").forEach(b=>b.addEventListener("click",()=>{const id=b.dataset.tog;S.orgOpen[id]=!isOrgOpen(idx().orgMap[id]);renderCover();const el=document.getElementById("org-"+id);if(el)el.querySelector("[data-tog]")?.focus();}));
  root.querySelectorAll("[data-org]").forEach(b=>b.addEventListener("click",()=>orgEdit(S.orgs.find(o=>o.id===b.dataset.org),null)));
  root.querySelectorAll("[data-addchild]").forEach(b=>b.addEventListener("click",()=>orgEdit(null,b.dataset.addchild)));
  root.querySelectorAll("[data-reveal]").forEach(b=>b.addEventListener("click",()=>revealOrg(b.dataset.reveal)));
  root.querySelectorAll("[data-recs]").forEach(b=>b.addEventListener("click",()=>openOrgRecs(b.dataset.recs,b.dataset.rf)));
}
function isOrgOpen(o){return S.orgOpen[o.id]??(!o.parentId&&o.kind!=="region");}
function revealOrg(id){
  let cur=idx().orgMap[idx().orgMap[id]?.parentId];let g=0;
  while(cur&&g++<10){S.orgOpen[cur.id]=true;cur=idx().orgMap[cur.parentId];}
  renderCover();
  const el=document.getElementById("org-"+id);if(!el)return;
  el.scrollIntoView({behavior:"smooth",block:"center"});
  el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),2200);
}
function treeNode(o){
  const m=coverData(),st=m[o.id];let kids=orgChildren(o.id);
  if(S.coverSort==="pri")kids=[...kids].sort((a,b)=>(m[b.id].score??-1)-(m[a.id].score??-1));
  const open=kids.length?isOrgOpen(o):false;
  const pri=st.pri;
  const w=st.cov==null?0:Math.min(100,st.cov/COV_TARGET*100);
  const shown=st.heads>0?Math.max(2,w):0;
  const name=kids.length
    ?`<button type="button" class="nm-tog" data-tog="${esc(o.id)}" aria-expanded="${open}"><span class="tri" aria-hidden="true">${open?"▾":"▸"}</span>${esc(o.name)}<span class="cnt">${st.kidN?`${st.kidN}`:kids.length}</span></button>`
    :`<span class="nm">${esc(o.name)}</span>`;
  const bar=st.members>0?`<div class="bar" role="img" aria-label="延べ接触率 ${pct(st.cov)||"0%"}、目標${Math.round(COV_TARGET*100)}%"><i class="pc-${pri||"none"}" style="width:${shown}%"></i></div>`:"";
  const meta=[];
  if(st.members>0)meta.push(`<span>在住 ${st.members.toLocaleString()}人</span>`,`<span>延べ ${st.heads.toLocaleString()}人(接触 ${pct(st.cov)||"0%"} / 目標${Math.round(COV_TARGET*100)}%)</span>`);
  meta.push(`<span>${agoTxt(st)}</span>`);
  if(st.n||st.abs)meta.push(`<button type="button" class="cnt-btn" data-recs="${esc(o.id)}" data-rf="all" aria-label="${esc(o.name)}の記録を見る">記録 ${st.n}件(トーク${st.k.talk} あいさつ${st.k.greet} 研修${st.k.training})${st.abs?` ほか欠席${st.abs}件`:""}</button>`);
  if(st.kidN)meta.push(`<span>記録のある職場 ${st.touchedKids}/${st.kidN}</span>`);
  if(st.hiKids)meta.push(`<span class="hi">今行きたい職場 ${st.hiKids}か所</span>`);
  if(st.unk)meta.push(`<button type="button" class="cnt-btn unk" data-recs="${esc(o.id)}" data-rf="unk" aria-label="${esc(o.name)}の人数未確認の記録を見て入れる">人数未確認 ${st.unk}件</button>`);
  if(st.people)meta.push(`<span>登録した人 ${st.people}人</span>`);
  const inner=`<div class="node${pri==="high"?" is-high":""}">
    <div class="nm-line">${name}${pri?`<span class="badge pb-${pri}">${PRI[pri][0]}</span>`:""}</div>
    <div class="node-act w-only"><button type="button" class="btn small ghost" data-org="${esc(o.id)}" aria-label="${esc(o.name)}を編集">編集</button></div>
    ${bar}<div class="meta">${meta.join("")}</div></div>`;
  return `<li id="org-${esc(o.id)}">${inner}${kids.length&&open?`<ul class="tree">${kids.map(treeNode).join("")}</ul>`:""}</li>`;
}
function orgEdit(o,parentId){
  const pk=parentId?idx().orgMap[parentId]?.kind:"";
  const w=o?{...o}:{name:"",kind:!parentId?"group":pk==="union"?"branch":pk==="branch"?"workplace":pk==="jhs"?"es":pk==="region"?"jhs":"group",members:"",parentId:parentId||"",order:S.orgs.length};
  const opts=flatOrgs().filter(({o:x})=>!o||!descIds(o.id).includes(x.id));
  const html=`<div class="stack">
    <label class="f"><span>名前</span><input type="text" data-f="name" value="${esc(w.name)}" placeholder="例: 〇〇支部、△△職場"></label>
    <div class="grid2"><label class="f"><span>種類</span><select data-f="kind">${ORGKIND.map(([k,v])=>`<option value="${k}"${w.kind===k?" selected":""}>${v}</option>`).join("")}</select></label>
    <label class="f"><span>担当地域に在住の人数(分かれば)</span><input type="number" inputmode="numeric" data-f="members" value="${esc(w.members??"")}"></label></div>
    <label class="f"><span>上の組織</span><select data-f="parentId"><option value="">(いちばん上)</option>${opts.map(({o:x,depth})=>`<option value="${esc(x.id)}"${w.parentId===x.id?" selected":""}>${"　".repeat(depth)}${esc(x.name)}</option>`).join("")}</select></label>
    <div class="row"><button type="button" class="btn primary" id="oe-save">保存する</button>${o?`<button type="button" class="btn" id="oe-child">この下に組織を追加</button><button type="button" class="btn danger" id="oe-del">消す</button>`:""}</div>
    ${o?`<p class="small muted">消しても、記録そのものは残ります(組織の名前だけが外れます)。下に組織がある場合は消せません。</p>`:""}</div>`;
  openSheet({mode:"edit",title:o?"組織を直す":"組織を追加",html,bind:root=>{
    const sync=e=>{const f=e.target.dataset.f;if(f)w[f]=e.target.value;};root.addEventListener("input",sync);root.addEventListener("change",sync);
    $("#oe-save").addEventListener("click",async ev=>{if(!w.name.trim()){toast("名前を入れてください");return;}ev.target.disabled=true;
      try{await put("orgs",{...stripPriv(w),id:o?o.id:newId(),name:w.name.trim(),members:w.members===""?null:Number(w.members),updatedAt:now()});closeSheet();toast("保存しました");}
      catch(e){ev.target.disabled=false;toast(dbErr(e),5000);}});
    $("#oe-child")?.addEventListener("click",()=>orgEdit(null,o.id));
    $("#oe-del")?.addEventListener("click",armed($("#oe-del"),"もう一度押すと消します",async()=>{if(orgChildren(o.id).length){toast("下に組織があるので消せません");return;}try{await del("orgs",o.id);closeSheet();toast("消しました");}catch(e){toast(dbErr(e),5000);}}));
  }});
}

    const flag=(k,msg)=>async()=>{const c=cur(id);if(!c)return;const prev={[k]:!!c[k]};
      try{await put("contacts",{...stripPriv(c),[k]:true,updatedAt:now()});toast(msg,0,undoFor(id,prev));}catch(e){toast(dbErr(e),5000);}};
    card.querySelector('[data-u="absent"]').addEventListener("click",flag("absent","欠席の回にしました。記録は残り、数からは外れます"));

    card.querySelector('[data-u="ask"]')?.addEventListener("click",async()=>{const c=cur(id);if(!c)return;const prev={needs:c.needs||[]};
      try{await put("contacts",{...stripPriv(c),needs:[...new Set([...(c.needs||[]),"headcount"])],updatedAt:now()});toast("確認待ちに入れました。記録一覧の「確認待ち」から、確認先ごとにまとめて聞けます",0,undoFor(id,prev));}catch(e){toast(dbErr(e),5000);}});

function openSheet(cfg){if(S.sheet&&S.sheet.kind==="event"&&cfg&&cfg.mode==="view"&&cfg.kind!=="event")S.sheetBack={...S.sheet};S.sheet=cfg;drawSheet();}
function closeSheet(){S.sheet=null;S.sheetBack=null;$("#sheet-root").innerHTML="";}
function refreshSheet(){if(S.sheet&&S.sheet.mode==="view")drawSheet();}
function drawSheet(){
  const cfg=S.sheet;if(!cfg)return;
  let title=cfg.title||"",html=cfg.html||"",bind=cfg.bind;
  if(cfg.mode==="view"){
    if(cfg.kind==="person"){const p=idx().pMap[cfg.id];if(!p)return closeSheet();title="人";html=personView(p);bind=root=>bindPersonView(root,p);}
    if(cfg.kind==="contact"){const c=S.contacts.find(x=>x.id===cfg.id);if(!c)return closeSheet();title="記録";html=contactView(c);bind=root=>bindContactView(root,c);}
    if(cfg.kind==="item"){const it=S.items.find(x=>x.id===cfg.id);if(!it)return closeSheet();title=it.type==="voice"?"頂いた声":"自分の約束";html=itemView(it);bind=root=>bindItemView(root,it);}
    if(cfg.kind==="guide"){const g=S.guide.find(x=>x.id===cfg.id);if(!g)return closeSheet();title="頂いた指導";html=guideView(g);bind=root=>bindGuideView(root,g);}
    if(cfg.kind==="princ"){const p=S.princ.find(x=>x.id===cfg.id);if(!p)return closeSheet();title="心得";html=princView(p);bind=root=>bindPrincView(root,p);}
    if(cfg.kind==="event"){const e=findEv(cfg.id);if(!e)return closeSheet();title="会う前に";html=eventView(e);bind=root=>bindEventView(root,e);}
    if(cfg.kind==="task"){const x=S.desk.tasks.find(y=>y.id===cfg.id);if(!x)return closeSheet();title=TK[x.kind]||"業務";html=taskView(x);bind=root=>bindTaskView(root,x);}
    if(cfg.kind==="sched"){const x=S.desk.sched.find(y=>y.id===cfg.id);if(!x)return closeSheet();title="日程の調整";html=schedView(x);bind=root=>bindSchedView(root,x);}
    if(cfg.kind==="logfil"){title="絞り込み";html=logFilView(cfg);bind=root=>bindLogFil(root,cfg);}
    if(cfg.kind==="orgrecs"){if(cfg.id&&!idx().orgMap[cfg.id])return closeSheet();title=orgRecsTitle(cfg);html=orgRecsView(cfg);bind=root=>bindOrgRecs(root,cfg);}
  }
  const kept={};document.querySelectorAll("#sheet-body [data-keep]").forEach(x=>{if(x.value)kept[x.dataset.keep]=x.value;});
  const focusKey=document.activeElement?.dataset?.keep||null;
  const back=cfg.mode==="view"&&cfg.kind!=="orgrecs"&&S.sheetBack?S.sheetBack:null;
  const scroll=$(".sheet")?.scrollTop||0;
  $("#sheet-root").innerHTML=`<div class="sheet-wrap"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><div class="lead">${back?`<button type="button" class="iconbtn" id="sheet-back">${back.kind==="event"?"‹ 予定へ":"‹ 一覧へ"}</button>`:""}<h2>${esc(title)}</h2></div><button type="button" class="iconbtn" id="sheet-x">閉じる</button></div><div id="sheet-body">${html}</div></div></div>`;
  const sh=$(".sheet");if(cfg.mode==="view")sh.scrollTop=scroll;
  $("#sheet-x").addEventListener("click",closeSheet);
  $("#sheet-back")?.addEventListener("click",()=>{const b=S.sheetBack;S.sheetBack=null;openSheet(b);});
  $(".sheet-wrap").addEventListener("click",e=>{if(e.target.classList.contains("sheet-wrap")&&S.sheet?.mode!=="edit")closeSheet();});
  const body=$("#sheet-body");body.querySelectorAll("[data-cid]").forEach(b=>b.addEventListener("click",()=>{if(S.sheet?.kind==="orgrecs")S.sheetBack={...S.sheet};openContact(b.dataset.cid);}));
  body.querySelectorAll("[data-author]").forEach(sp=>{const id=sp.dataset.author;if(!id||!S.userNS?.profiles)return;S.userNS.profiles([id]).then(ps=>{const nm=ps&&ps[id]&&ps[id].name;if(nm)sp.textContent=`記録した人: ${nm}`;}).catch(()=>{});});
  if(bind)bind(body);
  for(const [k,v] of Object.entries(kept)){const x=body.querySelector(`[data-keep="${CSS.escape(k)}"]`);if(x)x.value=v;}
  if(focusKey)body.querySelector(`[data-keep="${CSS.escape(focusKey)}"]`)?.focus({preventScroll:true});
}
function armed(btn,msg,fn){let on=false,orig=null,t;return function(){if(!on){on=true;orig=this.textContent;this.textContent=msg;clearTimeout(t);t=setTimeout(()=>{on=false;this.textContent=orig;},3500);return;}clearTimeout(t);on=false;fn();};}
function bindPersonView(root,p){
  root.querySelector('[data-act="photo"]')?.addEventListener("click",()=>pickPhotoFor(p));
  const up=root.querySelector('[data-act="unphoto"]');if(up)up.addEventListener("click",armed(up,"もう一度押すと外します",async()=>{const old=p.photo;try{await put("people",{...stripPriv(p),photo:"",photoData:"",photoSource:"",updatedAt:now()});if(old&&S.assets)S.assets.delete(old).catch(()=>{});toast("写真を外しました");}catch(e){toast(dbErr(e),5000);}}));
  root.querySelector('[data-act="star"]').addEventListener("click",async()=>{try{await put("people",{...stripPriv(p),important:!p.important,updatedAt:now()});}catch(e){toast(dbErr(e),5000);}});
  root.querySelector('[data-act="edit"]').addEventListener("click",()=>personEdit(p));
  root.querySelector('[data-act="newrec"]').addEventListener("click",()=>{const d=S.draft;d.structured=true;if(!d.people.some(x=>x.id===p.id))d.people.push({id:p.id,name:p.name});if(p.orgId&&!d.orgIds.includes(p.orgId))d.orgIds.push(p.orgId);saveDraft();closeSheet();S.tab="home";renderMain(true);window.scrollTo(0,0);toast(`${p.name}さんを「会った人」に入れました`);});
  const db=root.querySelector('[data-act="del"]');db.addEventListener("click",armed(db,"もう一度押すと消します(記録は残ります)",async()=>{try{await del("people",p.id);if(p.photo&&S.assets)S.assets.delete(p.photo).catch(()=>{});closeSheet();toast("消しました");}catch(e){toast(dbErr(e),5000);}}));
}
function bindContactView(root,c){
  root.querySelector('[data-act="edit"]').addEventListener("click",()=>contactEdit(c));
  const db=root.querySelector('[data-act="del"]');db.addEventListener("click",armed(db,"もう一度押すと消します",async()=>{try{await del("contacts",c.id);closeSheet();toast("消しました(声と約束は残ります)");}catch(e){toast(dbErr(e),5000);}}));
}
function bindItemView(root,it){
  root.querySelectorAll("[data-st]").forEach(b=>b.addEventListener("click",async()=>{const st=b.dataset.st;if(st===it.status)return;
    const name=((it.type==="promise"?PSTAT:VSTAT).find(x=>x[0]===st)||[])[1];
    try{await put("items",{...stripPriv(it),status:st,log:[...(it.log||[]),{date:today(),note:`状態を「${name}」にした`}],updatedAt:now(),closedAt:st==="done"?now():null});toast(`「${name}」にしました`);}catch(e){toast(dbErr(e),5000);}}));
  root.querySelector('[data-act="save"]').addEventListener("click",async()=>{try{await put("items",{...stripPriv(it),due:$("#i-due").value,linkTo:$("#i-link").value.trim(),tags:splitTags($("#i-tags").value),updatedAt:now()});toast("保存しました");}catch(e){toast(dbErr(e),5000);}});
  root.querySelector('[data-act="log"]').addEventListener("click",async()=>{const v=$("#i-log").value.trim();if(!v){toast("経過を書いてください");return;}
    try{await put("items",{...stripPriv(it),log:[...(it.log||[]),{date:today(),note:v}],updatedAt:now()});toast("経過を書きました");}catch(e){toast(dbErr(e),5000);}});
  root.querySelector('[data-act="fb"]')?.addEventListener("click",()=>{S.sheet.mode="edit";draftFeedback(it,root);});
  root.querySelector('[data-act="edittext"]').addEventListener("click",()=>{
    openSheet({mode:"edit",title:"文を直す",html:`<div class="stack"><textarea id="it-text" style="min-height:120px">${esc(it.text)}</textarea><div class="row"><button type="button" class="btn primary" id="it-save">保存する</button><button type="button" class="btn ghost" id="it-cancel">やめる</button></div></div>`,bind:r=>{
      $("#it-cancel").addEventListener("click",()=>openSheet({mode:"view",kind:"item",id:it.id}));
      $("#it-save").addEventListener("click",async()=>{const v=$("#it-text").value.trim();if(!v)return;try{await put("items",{...stripPriv(it),text:v,updatedAt:now()});openSheet({mode:"view",kind:"item",id:it.id});toast("保存しました");}catch(e){toast(dbErr(e),5000);}});}});
  });
  const db=root.querySelector('[data-act="del"]');db.addEventListener("click",armed(db,"もう一度押すと消します",async()=>{try{await del("items",it.id);closeSheet();toast("消しました");}catch(e){toast(dbErr(e),5000);}}));
}

async function saveFile(filename,blob){
  if(!S.downloads){toast("この画面では書き出せません");return false;}
  try{await S.downloads.save({filename,data:blob});ls("jn-lastexport",today());renderHomeSummary();toast("書き出しました");return true;}
  catch(e){if(e?.code!=="declined")toast("書き出せませんでした",4000);return false;}
}

  if(showK())o.kokoro={guidance:s(S.guide),principles:s(S.princ),memos:Object.entries(S.kmemo).map(([id,memo])=>({id,memo})),root:S.kroot||{}};
  if(showK())o.desk={tasks:s(S.desk.tasks),sched:s(S.desk.sched),news:s(S.desk.news),inbox:s(S.desk.inbox),plaud:s(Object.values(S.desk.plaud)),evlinks:s(Object.values(S.desk.evlinks))};return o;}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function exportXlsx(){
  const b=$("#x-xlsx");b.disabled=true;b.textContent="準備しています";

    add("人",S.people.map(p=>({氏名:p.name,よみ:p.kana,所属:p.org,役割:p.title,"組合・職場":orgPath(p.orgId),紹介者:pm[p.introducedBy]?.name||"",関心ごと:p.interests,覚えておきたいこと:p.note,電話:p.phone,メール:p.email,住所:p.address,重要:p.important?"★":"",会った回数:p._n||0,前回:p._last||"",初回:p._first||""})));

    add("声と約束",S.items.map(it=>({種類:it.type==="voice"?"声":"約束",内容:it.text,相手:nm(it.personIds),状態:itemStatusName(it),期限:it.due||"",つなぎ先:it.linkTo||"",分野:(it.tags||[]).join("、"),経過:(it.log||[]).map(l=>`${l.date} ${l.note}`).join("\n")})));
    add("職場別の実績",flatOrgs().filter(({o})=>!orgChildren(o.id).length).map(({o})=>{const st=coverData()[o.id];const par=idx().orgMap[o.parentId];return {上の組織:par?.name||"",名前:o.name,在住者数:o.members??"",延べ接触率:st.cov==null?"":Math.round(st.cov*1000)/10+"%",優先度:st.pri?PRI[st.pri][0]:"",最後からの日数:st.ds??"",人数未確認:st.unk,トーク:st.k.talk,あいさつ運動:st.k.greet,研修あいさつ:st.k.training,記録件数:st.n,延べ人数:st.heads,最後:st.last||""};}));
    if(showK()){
      add("指導",S.guide.slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))).map(g=>({日付:g.date||"",種類:GK[g.kind]||"",内容:g.text,自分の言葉:g.mine||"",くださった方:nm(g.personIds)||g.from||"",整理:GS[g.status||"new"]||"",心得:S.princ.find(p=>p.id===g.principleId)?.text||"",お礼:g.thankedAt||"",実践の報告:g.reportedAt||"",要確認:g.caution?"要確認":"",経過:(g.log||[]).map(l=>`${l.date} ${l.note}`).join("\n")})));
      add("心得",princSorted("active").concat(princSorted("review"),princSorted("habit")).map(p=>({心得:p.text,状態:(PRSTAT.find(x=>x[0]===(p.status||"active"))||[])[1]||"",由来:p.why||"",場面:p.scene||"",目安:p.measure||"",点検:(p.checks||[]).map(c=>`${c.date} ${(CHK.find(x=>x[0]===c.result)||[])[1]||""}${c.note?" "+c.note:""}`).join("\n")})));
    }
    if(showK()){
      add("業務の約束・相手待ち",S.desk.tasks.map(x=>({種類:TK[x.kind]||"",内容:x.text,相手:x.who||"",期限:x.due||"",状態:(TSTAT.find(y=>y[0]===(x.status||"open"))||[])[1]||"",共同対応:x.co?"共同":"",最後に確かめた日:x.lastCheckedAt||"",経過:(x.log||[]).map(l=>`${l.date} ${l.note}`).join("\n")})));
      add("日程の調整",S.desk.sched.map(x=>({件名:x.title,相手:x.who||"",経路:CH[x.channel]||"",候補:(x.cands||[]).map(c=>`${c.date} ${c.start||""}`).join("、"),返事の期限:x.replyBy||"",状態:SCN[x.status||"open"]||"",決定:x.fixed?`${x.fixed.date} ${x.fixed.start||""}`:""})));

function importJson(){
  const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";
  inp.addEventListener("change",async()=>{const f=inp.files[0];if(!f)return;const prog=$("#x-prog");
    try{const d=JSON.parse(await f.text());if(d.app!=="jinmyaku-note")throw new Error("x");
      const all=[["orgs",d.orgs],["people",d.people],["contacts",d.contacts],["items",d.items]];const total=all.reduce((a,[,l])=>a+(l||[]).length,0);let n=0;
      if(!S.canWrite)throw{code:"invalid_argument"};for(const [name,l] of all){const ok=(l||[]).filter(o=>o.id).map(o=>({...o,updatedBy:S.uid,createdBy:o.createdBy||S.uid}));await JNAPP.bulkSet("shared/main/"+name,ok);n+=ok.length;if(prog)prog.textContent=`${n} / ${total}`;}
      if(d.desk&&showK()){for(const [name,l] of Object.entries(d.desk)){if(!["tasks","sched","news","inbox","plaud","evlinks"].includes(name))continue;for(const o of l||[]){if(!o.id)continue;const {id,...b}=o;await dcol(name).doc(id).set(b);n++;}}}
      if(d.kokoro&&showK()){for(const [name,l] of [["guidance",d.kokoro.guidance],["principles",d.kokoro.principles],["memos",d.kokoro.memos]])for(const o of l||[]){if(!o.id)continue;await kput(name,o);n++;}}
      if(prog)prog.textContent="";toast(`${n}件を読み込みました`,4000);
    }catch(e){toast("このファイルは読み込めませんでした",4500);}});
  inp.click();
}

function princSorted(st){return S.princ.filter(p=>(p.status||"active")===st).sort((a,b)=>(a.order??999)-(b.order??999)||String(a.createdAt||"").localeCompare(String(b.createdAt||"")));}
