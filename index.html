function princCard(p){const gs=S.guide.filter(g=>g.principleId===p.id);const pm=idx().pMap;const who=[...new Set(gs.flatMap(g=>(g.personIds||[]).map(id=>pm[id]?.name).filter(Boolean)))];const last=(p.checks||[]).slice(-1)[0];
  const meta=[p.scene?`場面: ${esc(p.scene)}`:"",who.length?`${esc(who.slice(0,3).join("・"))}さん${who.length>3?`ほか${who.length-3}人`:""}から`:(gs.length?`指導${gs.length}件から`:""),p.measure?`目安: ${esc(p.measure)}`:""].filter(Boolean).join(" ／ ");
  return `<button type="button" class="princ" data-princ="${esc(p.id)}"><span class="tx">${esc(p.text)}</span>${meta?`<span class="meta">${meta}</span>`:""}${last?`<span class="meta">前回の点検: ${md(last.date)} ${esc((CHK.find(c=>c[0]===last.result)||[])[1]||"")}</span>`:""}</button>`;}
function renderKokoro(){
  if(!showK()){$("#main").innerHTML=`<p class="notice small" style="margin-top:16px">この画面は、ノートの持ち主だけが使えます。</p>`;return;}
  const act=princSorted("active"),rest=[...princSorted("review"),...princSorted("habit")];
  const nNew=S.guide.filter(g=>(g.status||"new")==="new").length;

/* 日程の調整 */

const CH={mail:"メール",teams:"Teams",phone:"電話",line:"LINE",paper:"紙・FAX",web:"Webフォーム",invite:"会議の招待",talk:"対面",other:"その他"};

/* 仮押さえ: 予定の正本はOutlook。候補は受けたその場でOutlookに【仮】(仮の予定)として入れ、決めたら確定(予定あり)に書き換える */
const TZ="Tokyo Standard Time";
const holdSubj=s=>(`【仮】${s.title||"日程の調整"}${s.who?`(${s.who})`:""} By ノート`).slice(0,255);
const fixSubj=s=>(`${s.title||"予定"}${s.who?`(${s.who})`:""} By ノート`).slice(0,255);
async function msWrite(tool,input){if(!S.mcp)throw{code:"not_granted"};const r=await S.mcp.callTool(MS,tool,input);try{S.mcp.invalidate&&S.mcp.invalidate(MS,"outlook_calendar_search");}catch(e){}return parseMs(r);}
function candTime(c){const end=c.end&&c.end>c.start?c.end:addMin(c.start,60);return {start:{dateTime:`${c.date}T${c.start}:00`,timeZone:TZ},end:{dateTime:`${c.date}T${end}:00`,timeZone:TZ}};}
async function holdCand(s,c){const input={subject:holdSubj(s),...candTime(c),showAs:"tentative",body:"日程の調整中の仮押さえです(人脈ノートから)。決まったら確定に書き換え、相手から正式な招待が届いたら消します。"};if(c.place)input.location=String(c.place).slice(0,500);
  const rows=await msWrite("outlook_create_event",input);const x=rows.find(r=>r&&typeof r.id==="string"&&r.id);if(!x)throw{code:"no_id"};return x.id;}
async function holdAll(s){const cands=(s.cands||[]).map(c=>({...c}));let ok=0,ng=0,err=null;
  for(const c of cands){if(c.eventId||!c.date||!c.start)continue;try{c.eventId=await holdCand(s,c);ok++;}catch(e){ng++;err=e;}}
  if(ok)await dput("sched",{...stripPriv(s),cands,outlook:s.outlook==="entered"?"entered":"held",log:[...(s.log||[]),{date:today(),note:`Outlookに仮押さえ(${ok}件)`}]});
  for(const d of new Set(cands.map(c=>c.date)))if(d&&S.cal[d])loadCal(d,true);
  return {ok,ng,err,noTime:cands.filter(c=>!c.eventId&&(!c.date||!c.start)).length};}
async function fixCand(s,i){const cands=(s.cands||[]).map(c=>({...c}));const c=cands[i];if(!c)return;
  if(c.eventId)await msWrite("outlook_update_event",{eventId:c.eventId,subject:fixSubj(s),showAs:"busy"});
  else if(c.date&&c.start){const input={subject:fixSubj(s),...candTime(c),showAs:"busy"};if(c.place)input.location=String(c.place).slice(0,500);const rows=await msWrite("outlook_create_event",input);const x=rows.find(r=>r&&typeof r.id==="string"&&r.id);if(x)c.eventId=x.id;}
  await dput("sched",{...stripPriv(s),cands,fixed:{...c},status:"fixed",outlook:"entered",log:[...(s.log||[]),{date:today(),note:`${c.date} ${c.start||""} に決め、Outlookを確定に書き換えた`}]});

const isFixedCand=(s,c)=>s.status==="fixed"&&s.fixed&&c.date===s.fixed.date&&c.start===s.fixed.start;
async function releaseHolds(s){const cands=(s.cands||[]).map(c=>({...c}));let n=0,ng=0;

  await dput("sched",{...stripPriv(s),cands,log:[...(s.log||[]),{date:today(),note:`選ばれなかった仮押さえをOutlookから消した(${n}件)`}]});

function holdErrText(e){if(e&&e.code==="approval_required")return "許可がなかったため、Outlookに入れられませんでした。もう一度押して許可してください。";if(e&&e.code==="no_id")return "Outlookに入ったか確かめられませんでした。予定表を確かめてください。";return msErrText(e).replace("予定を読み込めませんでした","Outlookに入れられませんでした");}
function schedLi(s){const cs=s.cands||[];return `<li><button type="button" class="item" data-sched="${esc(s.id)}"><span class="top"><span class="badge acc">${esc(SCN[s.status||"open"])}</span>${s.channel?`<span class="badge">${esc(CH[s.channel]||s.channel)}</span>`:""}${s.replyBy&&schOpen(s)?`<span class="badge ${s.replyBy<today()?"bad":(s.replyBy<=addDays(today(),1)?"warn":"")}">返事 ${esc(md(s.replyBy))}まで</span>`:""}</span><span class="txt" style="display:block">${esc(s.title||"(件名なし)")}</span><span class="s">${esc(s.who||"")}${cs.length?`${s.who?" ／ ":""}候補 ${esc(cs.map(c=>md(c.date)+(c.start?" "+c.start:"")).join("・"))}`:""}</span></button></li>`;}
function candState(c,sc){if(!c.date)return {k:"?",cls:"",t:"日付が分かりません"};const cal=S.cal[c.date];if(!cal||!cal.events)return {k:"…",cls:"",t:S.mcp?"予定を確かめています":"予定を読めません"};if(!c.start)return {k:"?",cls:"",t:"時刻が分かりません"};
  const s=`${c.date}T${c.start}`,e=`${c.date}T${c.end||addMin(c.start,60)}`;const own=new Set(((sc&&sc.cands)||[]).map(x=>x.eventId).filter(Boolean));const hs=sc?holdSubj(sc):"",fs=sc?fixSubj(sc):"";const hits=cal.events.filter(x=>{const i=evInfo(x);return !i.off&&!x.isAllDay&&x.start<e&&s<x.end&&!own.has(x.id)&&x.subject!==hs&&x.subject!==fs;});
  if(!hits.length)return {k:"○",cls:"ok",t:"空いています"};if(hits.every(x=>evInfo(x).tentative))return {k:"△",cls:"mid",t:"仮の予定と重なる: "+hits.map(x=>x.subject).join("、")};return {k:"×",cls:"ng",t:"重なる: "+hits.map(x=>`${x.start.slice(11,16)} ${x.subject}`).join("、")};}
function schedView(s){const cs=s.cands||[];return `<div class="stack">

  <div><button type="button" class="btn" data-act="sdraft">返事の下書き</button><div id="s-fb"></div></div>
  <div><div class="qlabel">状態</div><div class="qchips">${SCH.map(([k,v])=>`<button type="button" class="qchip" data-ss="${k}" aria-pressed="${(s.status||"open")===k}">${v}</button>`).join("")}</div></div>
  <p class="notice small" style="margin:0">仮押さえは、Outlookに「【仮】」の件名と「仮の予定」の表示で入り、ほかの方にも仮だと分かります。「これに決める」で確定(予定あり)に変わります。</p>

async function draftSchedReply(s,root){const out=root.querySelector("#s-fb");if(!S.sample){toast("この版では、下書きは使えません");return;}

async function intakeAI(){const tx=$("#in-text").value.trim();if(!tx){toast("中身を書いてください");return;}const btn=$("#in-ai"),busy=$("#in-busy");btn.disabled=true;busy.innerHTML=`<span class="busy">振り分けています(10〜40秒)</span>`;

function intakeReview(items){const ok=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||"")?d:"";const tm=t=>/^\d{1,2}:\d{2}$/.test(t||"")?t.padStart(5,"0"):"";

    else toast(heldT.length&&!S.mcp?"入れました。Outlookへの仮押さえはSSAに頼んでください":"入れました",4500);}catch(e){toast(dbErr(e),5000);}});}

function nextCands(n){const m=coverData();const lv=S.orgs.filter(isLeafOrg).filter(o=>m[o.id]);

  const re=()=>{renderCapture();renderHomeSummary();};
  el.querySelectorAll("[data-d]").forEach(b=>b.addEventListener("click",()=>{LD.date=b.dataset.d===t?"":b.dataset.d;saveLD();re();}));
  $("#l-date").addEventListener("change",e=>{const v=e.target.value;LD.date=!v||v===t?"":v;saveLD();re();});
  $("#l-kind").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b)return;LD.kind=b.dataset.k;saveLD();$("#l-kind").querySelectorAll("[data-k]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.k===LD.kind)));});
  $("#l-orgs").addEventListener("click",e=>{const b=e.target.closest("[data-orm]");if(!b)return;LD.orgIds=LD.orgIds.filter(x=>x!==b.dataset.orm);saveLD();re();});
  el.querySelectorAll("[data-ro]").forEach(b=>b.addEventListener("click",()=>{LD.orgIds.push(b.dataset.ro);saveLD();re();}));
  $("#l-pick").addEventListener("click",()=>pickOrgSheet(LD.orgIds,ids=>{LD.orgIds=ids;saveLD();re();}));
  $("#l-head").addEventListener("input",e=>{LD.headcount=e.target.value;saveLD();});
  el.querySelectorAll("[data-h]").forEach(b=>b.addEventListener("click",()=>{LD.headcount=b.dataset.h;$("#l-head").value=LD.headcount;saveLD();}));
  $("#l-sum").addEventListener("input",e=>{LD.summary=e.target.value;saveLD();});
  $("#l-tags").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;const x=b.dataset.t;LD.tags=LD.tags.includes(x)?LD.tags.filter(z=>z!==x):[...LD.tags,x];saveLD();b.setAttribute("aria-pressed",String(LD.tags.includes(x)));});
  $("#l-save").addEventListener("click",async ev=>{
    if(!LD.orgIds.length){toast("どこ(職場・地域)を選んでください");$("#l-pick").focus();return;}
    const hc=String(LD.headcount).trim();if(hc!==""&&!(Number(hc)>=0)){toast("人数は数字で入れてください");return;}
    ev.target.disabled=true;const id=newId();
    try{await put("contacts",{id,date:ldDate(),kind:LD.kind,place:"",headcount:hc===""?null:Number(hc),orgIds:[...LD.orgIds],personIds:[],summary:LD.summary.trim(),memo:"",tags:[...LD.tags],createdAt:now(),updatedAt:now()});
      const keep={date:LD.date,kind:LD.kind};LD=Object.assign(emptyL(),keep);saveLD();re();window.scrollTo({top:0,behavior:"smooth"});
      toast(hc===""&&LD.kind!=="greet"?"保存しました(人数はあとで入れられます)":"保存しました",6000,{label:"取り消す",fn:async()=>{try{await del("contacts",id);toast("取り消しました");}catch(e){toast(dbErr(e),5000);}}});}
    catch(e){ev.target.disabled=false;toast(dbErr(e),5000);}});
  renderRecent();
};
/* 職場を選ぶ: 支部ごとに並べ、押すだけ。名前でも探せる */
function orgGroups(){const out=[];const rootLeaves=orgChildren("").filter(isLeafOrg);
  for(const {o} of flatOrgs()){const lv=orgChildren(o.id).filter(isLeafOrg);if(lv.length)out.push({o,leaves:lv});}
  if(rootLeaves.length)out.push({o:null,leaves:rootLeaves});return out;}
function pickOrgSheet(sel,done){const ids=[...sel];let q="";
  const body=()=>{const n=norm(q);const gs=orgGroups().map(g=>({o:g.o,leaves:g.leaves.filter(x=>!n||norm(x.name).includes(n)||(g.o&&norm(g.o.name).includes(n)))})).filter(g=>g.leaves.length);
    return gs.length?gs.map(g=>`<div class="lt-pg"><div class="lt-ph">${g.o?`<button type="button" class="linkish" data-pg="${esc(g.o.id)}" aria-pressed="${ids.includes(g.o.id)}">${esc(g.o.name)}${ids.includes(g.o.id)?" ✓":""}<span class="sub">(全体の場はここ)</span></button>`:"そのほか"}</div><div class="qchips">${g.leaves.map(x=>`<button type="button" class="qchip" data-po="${esc(x.id)}" aria-pressed="${ids.includes(x.id)}">${esc(x.name)}</button>`).join("")}</div></div>`).join(""):`<p class="small muted">当てはまる名前がありません。</p>`;};
  openSheet({mode:"edit",title:"どこ(職場・地域)",html:`<div class="stack"><input type="search" id="po-q" placeholder="名前で探す" autocomplete="off" aria-label="名前で探す"><div id="po-b">${body()}</div><div class="row lt-sticky"><button type="button" class="btn primary" id="po-ok">これで決める</button></div></div>`,bind:()=>{
    const b=$("#po-b");$("#po-q").addEventListener("input",e=>{q=e.target.value;b.innerHTML=body();});
    b.addEventListener("click",e=>{const x=e.target.closest("[data-po],[data-pg]");if(!x)return;const id=x.dataset.po||x.dataset.pg;const i=ids.indexOf(id);if(i>=0)ids.splice(i,1);else ids.push(id);const y=$("#sheet-root .sheet-body")?.scrollTop;b.innerHTML=body();});
    $("#po-ok").addEventListener("click",()=>{closeSheet();done(ids);});}});}
/* Excelから貼り付けて、支部と職場をまとめて入れる */
function pasteOrgSheet(){openSheet({mode:"edit",title:"Excelから貼り付ける",html:`<div class="stack">
  <p class="small" style="margin:0">Excelで「支部」「職場」「人数」の3列を選んでコピーし、下に貼り付けてください。人数は、担当地域に在住の人数です(空でもかまいません)。1列だけなら、いちばん上の組織として入ります。</p>
  <textarea id="pp-t" class="memo" style="min-height:180px" placeholder="第一支部	組立職場	420&#10;第一支部	塗装職場	310&#10;第二支部	物流職場	180"></textarea>
  <div class="row"><button type="button" class="btn primary" id="pp-go">入れる</button><span id="pp-n" class="small muted"></span></div></div>`,bind:()=>{
  const parse=()=>$("#pp-t").value.split(/\r?\n/).map(l=>l.split(/\t|,|、/).map(x=>x.trim())).filter(r=>r[0]);
  $("#pp-t").addEventListener("input",()=>{$("#pp-n").textContent=`${parse().length}行`;});
  $("#pp-go").addEventListener("click",async ev=>{const rows=parse();if(!rows.length){toast("貼り付けてください");return;}ev.target.disabled=true;
    const top={};for(const o of orgChildren(""))top[o.name]=o.id;const list=[];let ord=S.orgs.length;const mk=(name,kind,parentId,members)=>{const id=newId()+list.length.toString(36);list.push({id,name,kind,parentId,members,order:ord++,createdBy:S.uid,updatedBy:S.uid,createdAt:now(),updatedAt:now()});return id;};
    const have=new Set(S.orgs.map(o=>(o.parentId||"")+"/"+o.name));
    for(const r of rows){const num=x=>{const v=Number(String(x||"").replace(/[,，\s]/g,""));return x!==undefined&&x!==""&&v>=0?v:null;};
      if(!r[1]||/^\d[\d,]*$/.test(r[1])){if(!top[r[0]])top[r[0]]=mk(r[0],"branch","",num(r[1]));continue;}
      if(!top[r[0]])top[r[0]]=mk(r[0],"branch","",null);const k=top[r[0]]+"/"+r[1];if(have.has(k))continue;have.add(k);mk(r[1],"workplace",top[r[0]],num(r[2]));}
    try{await A.bulkSet("shared/main/orgs",list);closeSheet();toast(`${list.length}件を入れました`,4000);}catch(e){ev.target.disabled=false;toast(dbErr(e),5000);}});}});}
A.pasteOrgSheet=pasteOrgSheet;
/* 回り具合: タイル(職場ごとの色)と一覧 */
S.coverView=A.lsg("jn-cview")==="tree"?"tree":"tile";
function recCls(st){return st.ds==null?"t-none":st.ds<=30?"t-ok":st.ds<=90?"t-warn":"t-bad";}
function viewSeg(){return `<div class="fil-row" style="margin:6px 0 10px"><div class="seg" role="group" aria-label="見え方"><button type="button" data-cv="tile" aria-pressed="${S.coverView==="tile"}">タイル</button><button type="button" data-cv="tree" aria-pressed="${S.coverView==="tree"}">一覧(くわしく)</button></div></div>`;}
function bindSeg(){$("#main").querySelectorAll("[data-cv]").forEach(b=>b.addEventListener("click",()=>{S.coverView=b.dataset.cv;A.lss("jn-cview",S.coverView);renderCover();}));}
window.renderCover=function(){
  if(S.coverView==="tree"){renderCoverTree();$("#main h2")?.insertAdjacentHTML("afterend",viewSeg());bindSeg();return;}
  const m=coverData();const gs=orgGroups();const lv=S.orgs.filter(isLeafOrg);const touched=lv.filter(o=>m[o.id].n>0).length;
  let tm=0,th=0;for(const o of orgChildren("")){const st=m[o.id];if(st.members>0){tm+=st.members;th+=st.heads;}}
  const cnt={"t-ok":0,"t-warn":0,"t-bad":0,"t-none":0};for(const o of lv)cnt[recCls(m[o.id])]++;
  const tile=o=>{const st=m[o.id];const w=st.cov==null?0:Math.min(100,st.cov/COV_TARGET*100);
    return `<button type="button" class="lt-t ${recCls(st)}" data-tile="${esc(o.id)}" aria-label="${esc(o.name)}、${esc(dsTxt(st))}${st.members>0?`、接触${pct(st.cov)||"0%"}`:""}"><span class="lt-tn">${esc(o.name)}</span><span class="lt-ts">${esc(dsTxt(st))}${st.members>0?` ・${pct(st.cov)||"0%"}`:(st.heads?` ・延べ${st.heads}人`:"")}</span>${st.members>0?`<i class="lt-tb"><b style="width:${st.heads>0?Math.max(4,w):0}%"></b></i>`:""}</button>`;};
  $("#main").innerHTML=`<h2>回り具合</h2>${viewSeg()}
  ${lv.length?`<div class="panel"><div class="row" style="gap:18px"><div><b style="font-family:var(--serif);font-size:1.4rem">${touched} / ${lv.length}</b> <span class="muted small">記録のある職場・地域</span></div>${tm?`<div><b style="font-family:var(--serif);font-size:1.4rem">${pct(th/tm)||"0%"}</b> <span class="muted small">延べ接触率(目標${Math.round(COV_TARGET*100)}%)</span></div>`:""}</div>
    <div class="lt-lg" aria-label="色の意味"><span><i class="t-ok"></i>30日以内 ${cnt["t-ok"]}</span><span><i class="t-warn"></i>90日以内 ${cnt["t-warn"]}</span><span><i class="t-bad"></i>90日より前 ${cnt["t-bad"]}</span><span><i class="t-none"></i>まだ ${cnt["t-none"]}</span></div>
    <p class="small muted" style="margin:6px 0 0">色は最後に行ってからの日数、下の帯は延べ接触率(在住の人数を入れた職場だけ)です。押すと、記録や編集に進めます。</p></div>`:""}
  ${gs.length>1?`<div class="panel lt-ov" style="margin-top:10px"><div class="small muted" style="margin-bottom:4px">支部ごとのようす(押すと、その支部へ移ります)</div>${gs.map(g=>{const tk=g.leaves.filter(x=>m[x.id].n>0).length;return `<button type="button" class="lt-ov-r" data-jump="lt-g-${g.o?esc(g.o.id):"root"}"><span class="lt-ov-n">${g.o?esc(g.o.name):"そのほか"}</span><span class="lt-ds" aria-hidden="true">${g.leaves.map(x=>`<i class="lt-d ${recCls(m[x.id])}"></i>`).join("")}</span><span class="small muted">${tk}/${g.leaves.length}</span></button>`;}).join("")}</div>`:""}
  ${gs.length?gs.map(g=>{const st=g.o?m[g.o.id]:null;const tk=g.leaves.filter(x=>m[x.id].n>0).length;
    return `<section class="lt-g" id="lt-g-${g.o?esc(g.o.id):"root"}"><div class="lt-gh"><b>${g.o?esc(g.o.name):"そのほか"}</b><span class="small muted">記録あり ${tk}/${g.leaves.length}${st&&st.members>0?` ・接触 ${pct(st.cov)||"0%"}`:""}${st&&st.last?` ・最後 ${esc(dsTxt(st))}`:""}</span>${g.o?`<button type="button" class="btn small ghost w-only" data-gadd="${esc(g.o.id)}" aria-label="${esc(g.o.name)}に職場を足す">＋</button>`:""}</div>
      <div class="lt-gb" role="img" aria-label="記録のある職場 ${tk}/${g.leaves.length}"><i style="width:${g.leaves.length?tk/g.leaves.length*100:0}%"></i></div>
      <div class="lt-grid">${g.leaves.map(tile).join("")}</div></section>`;}).join(""):`<p class="muted">まだ組織がありません。</p>`}
  <div class="row w-only" style="margin-top:14px"><button type="button" class="btn small" id="o-add">＋組織を追加</button><button type="button" class="btn small" id="o-paste">Excelから貼り付ける</button></div>`;
  bindSeg();const root=$("#main");
  $("#o-add")?.addEventListener("click",()=>orgEdit(null,""));$("#o-paste")?.addEventListener("click",pasteOrgSheet);
  root.querySelectorAll("[data-gadd]").forEach(b=>b.addEventListener("click",()=>orgEdit(null,b.dataset.gadd)));
  root.querySelectorAll("[data-jump]").forEach(b=>b.addEventListener("click",()=>{const e=document.getElementById(b.dataset.jump);if(e){e.scrollIntoView({behavior:"smooth",block:"start"});e.classList.add("flash");setTimeout(()=>e.classList.remove("flash"),1800);}}));
  root.querySelectorAll("[data-tile]").forEach(b=>b.addEventListener("click",()=>tileSheet(b.dataset.tile)));
};
function tileSheet(id){const o=idx().orgMap[id];if(!o)return;const st=coverData()[id];
  openSheet({mode:"edit",title:o.name,html:`<div class="stack">
    <p class="small muted" style="margin:0">${esc(orgPath(id))}</p>
    <div class="panel"><div class="row" style="gap:18px"><div><b style="font-family:var(--serif);font-size:1.3rem">${esc(st.last?dsTxt(st):"まだ")}</b> <span class="muted small">${st.last?`最後に行った日 ${esc(md(st.last))}`:"行った記録がありません"}</span></div><div><b style="font-family:var(--serif);font-size:1.3rem">${st.n}</b> <span class="muted small">件の記録・延べ${st.heads.toLocaleString()}人</span></div>${st.members>0?`<div><b style="font-family:var(--serif);font-size:1.3rem">${pct(st.cov)||"0%"}</b> <span class="muted small">在住${st.members.toLocaleString()}人に対して</span></div>`:""}</div></div>
    <div class="row"><button type="button" class="btn primary w-only" id="ts-rec">ここを記録する</button>${st.n||st.abs?`<button type="button" class="btn" id="ts-list">記録を見る</button>`:""}<button type="button" class="btn ghost w-only" id="ts-edit">名前・人数を直す</button></div></div>`,bind:()=>{
    $("#ts-rec")?.addEventListener("click",()=>{if(!LD.orgIds.includes(id))LD.orgIds=[id];saveLD();closeSheet();S.tab="home";renderMain(true);window.scrollTo(0,0);});
    $("#ts-list")?.addEventListener("click",()=>openOrgRecs(id,"all"));
    $("#ts-edit")?.addEventListener("click",()=>orgEdit(o,null));}});}
/* ---------- 見本の記録(すべて架空) ---------- */
async function seedSample(){
  const t=today(),d=n=>addDays(t,n),ts=now(),me="local";
  const O=(id,name,kind,parentId,members,order)=>({id,name,kind,parentId,members,order,createdBy:me,createdAt:ts});
  const orgs=[O("s-union","見本労働組合","union","",null,1),
    O("s-br1","第一支部","branch","s-union",null,1),O("s-br2","第二支部","branch","s-union",null,2),O("s-br3","第三支部","branch","s-union",null,3),
    O("s-region","地域","region","",null,2),O("s-j1","みどり中学校区","jhs","s-region",null,1)];
  const W=[["s-br1",["組立一課",420],["組立二課",380],["塗装課",310],["検査課",150],["設計室",260],["保全課",120]],
           ["s-br2",["物流課",180],["生産管理課",140],["品質保証課",90],["調達課",75]],
           ["s-br3",["開発一部",330],["開発二部",290],["実験課",160],["総務課",60],["人事課",45]],
           ["s-j1",["みどり小学校区",null],["あおば小学校区",null]]];
  let n=0;const ids={};for(const [p,...ws] of W)ws.forEach(([nm,mem],i)=>{const id="s-w"+(++n);ids[nm]=id;orgs.push(O(id,nm,p==="s-j1"?"es":"workplace",p,mem,i+1));});
  const R=[["組立一課",-2,"talk",24,"通勤の渋滞の話が多かった",["交通・道路"]],["組立一課",-35,"talk",18,"",[]],["組立二課",-12,"talk",20,"寮の駐車場が足りない",["住まい・空き家"]],["塗装課",-48,"talk",15,"交替勤務と保育",["子育て・教育"]],
    ["検査課",-110,"training",12,"",[]],["物流課",-20,"talk",16,"",[]],["生産管理課",-75,"talk",9,"",[]],["開発一部",-5,"talk",30,"物価の話",["物価・くらし"]],["開発二部",-95,"talk",22,"",[]],
    ["実験課",-28,"greet",null,"朝のあいさつ運動",[]],["みどり小学校区",-9,"event",40,"通学路の白線が消えかけている",["交通・道路","地域・自治区"]],["設計室",-1,"talk",null,"人数はあとで確認",[]]];
  const cs=R.map(([nm,dd,kind,hc,sum,tags],i)=>({id:"s-c"+i,date:d(dd),kind,place:"",headcount:hc,orgIds:[ids[nm]],personIds:[],summary:sum,memo:"",tags,createdBy:me,createdAt:ts,updatedAt:ts}));
  await A.bulkSet("shared/main/orgs",orgs);await A.bulkSet("shared/main/contacts",cs);
}
A.seedSample=seedSample;
})();
